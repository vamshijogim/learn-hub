<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family Coach</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#1d2433;--mut:#5d6b82;--pri:#4f46e5;--pri2:#e0e7ff;--ok:#16a34a;--okbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2;--line:#d9e0ec;--warn:#fef3c7}
@media (prefers-color-scheme:dark){:root{--bg:#10141d;--card:#1a2030;--ink:#eef1f8;--mut:#9aa7bf;--pri:#818cf8;--pri2:#2a3050;--ok:#4ade80;--okbg:#14301f;--bad:#f87171;--badbg:#3a1a1a;--line:#2c3550;--warn:#3a321a}}
*{box-sizing:border-box}
body{margin:0;font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--pri);color:#fff;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:20px;margin:0 10px 0 0}
.chip{border:2px solid transparent;background:rgba(255,255,255,.18);color:#fff;border-radius:99px;padding:6px 14px;font-size:17px;cursor:pointer}
.chip.on{background:#fff;color:var(--pri);font-weight:700}
.stats{margin-left:auto;font-weight:700;white-space:nowrap}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 16px;max-width:900px;margin:0 auto}
nav button{border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;padding:10px 12px;border-radius:14px;cursor:pointer;text-align:left;line-height:1.3}
nav button span{color:var(--mut);display:block}
nav button b{display:block;font-size:17px}
nav button.on{background:var(--pri2);border-color:var(--pri)}
.lib{display:inline-block;border:2px solid var(--line);border-radius:10px;padding:4px 10px;margin:3px;font-size:15px;background:var(--card);color:var(--ink);cursor:pointer}.lib.ready{border-color:var(--ok);background:var(--okbg)}.lib.failed{border-color:var(--bad)}
.bgl{font-size:14px;color:var(--mut);background:var(--okbg);border-radius:10px;padding:8px 12px;margin:10px 0}
main{max-width:900px;margin:0 auto;padding:14px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0}
h2{font-size:24px;margin:6px 0}h3{font-size:19px;margin:8px 0 4px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--pri);color:#fff;border:0;border-radius:14px;padding:12px 20px;font-size:18px;font-weight:600;cursor:pointer;margin:4px 4px 4px 0}
.btn.big{padding:16px 26px;font-size:21px}
.btn.alt{background:var(--pri2);color:var(--pri)}
.btn.bad{background:var(--bad)}
.btn.sm{padding:6px 12px;font-size:15px;border-radius:10px}
.btn:disabled{opacity:.5}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin:4px 0}
textarea{min-height:110px}
label{font-size:15px;color:var(--mut);display:block;margin-top:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 140px}.row>.btn{flex:0 0 auto}
.mut{color:var(--mut);font-size:15px}
.tag{display:inline-block;background:var(--pri2);color:var(--pri);border-radius:99px;padding:3px 12px;margin:3px 4px 3px 0;font-size:15px;cursor:pointer;border:0}
.load{background:var(--warn);padding:12px;border-radius:12px;font-weight:600;margin:10px 0}
.step{display:flex;gap:12px;align-items:center;padding:12px;border:2px solid var(--line);border-radius:14px;margin:8px 0}
.step.done{opacity:.55;text-decoration:line-through}
.step .em{font-size:32px}.step .t{flex:1}
.cards{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.cards .c{flex:0 0 78%;max-width:340px;scroll-snap-align:center;background:var(--pri2);border-radius:18px;padding:16px;min-height:150px}
.cards .c .e{font-size:38px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 16px;margin:8px 0;font-size:18px;color:var(--ink);cursor:pointer}
.opt.sel{border-color:var(--pri);background:var(--pri2)}.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.no{border-color:var(--bad);background:var(--badbg)}
.fb{padding:10px 14px;border-radius:12px;margin:8px 0}.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}.fb.info{background:var(--warn)}
.chat{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow-y:auto;padding:6px}
.msg{padding:10px 14px;border-radius:16px;max-width:86%;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--pri);color:#fff}.msg.m{align-self:flex-start;background:var(--pri2)}
.vids{display:flex;gap:10px;flex-wrap:wrap}.vid{width:230px}.vid img{width:100%;border-radius:12px;cursor:pointer}
.vid iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}
.vidwide{width:100%}
details{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0;background:var(--card)}
summary{cursor:pointer;font-weight:700}
.big-t{font-size:44px;text-align:center;font-variant-numeric:tabular-nums;margin:10px}
.native{font-size:44px;line-height:1.2}
canvas{background:var(--card);border:2px dashed var(--line);border-radius:14px;touch-action:none;max-width:100%}
.stars{font-size:26px}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:14px;z-index:99;max-width:90%;display:none}
#toast.err{background:#b91c1c}
a{color:var(--pri)}
@media (max-width:620px){nav{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){body{font-size:17px}.stats{width:100%;margin:0}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<noscript>This app needs JavaScript.</noscript>
<script>
'use strict';
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const dkey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays=(k,n)=>{const d=new Date(k+'T12:00:00');d.setDate(d.getDate()+n);return dkey(d)};
const weekKey=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return dkey(d)};
const arr=x=>Array.isArray(x)?x:[];
const str=x=>x==null?'':String(x);
const mem={};
const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return k in mem?JSON.parse(mem[k]):d}},
  set(k,v){const s=JSON.stringify(v);try{localStorage.setItem(k,s);return true}catch(e){mem[k]=s;return false}},
  raw(k){try{return localStorage.getItem(k)||''}catch(e){return mem['raw_'+k]||''}},
  setRaw(k,v){try{localStorage.setItem(k,v)}catch(e){mem['raw_'+k]=v}},
  del(k){try{localStorage.removeItem(k)}catch(e){delete mem['raw_'+k]}}
};
function toast(m,err){const t=$('#toast');t.textContent=m;t.className=err?'err':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',err?6000:2600)}
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)+s.length.toString(36)};

/* ================= state ================= */
const DEF_SET={model:'gemini-3.8-flash',fast:'gemini-3.5-flash-lite',city:'',limit:200,hw:'hints',pin:'',research:true,bg:true,bgMax:40};
let LASTSRC=[];
let S=normState(LS.get('fc_state',null));
function normState(s){s=s||{};s.profiles=arr(s.profiles).map(p=>newP(p));s.set=Object.assign({},DEF_SET,s.set||{});s.usage=s.usage||{day:'',calls:0,tokens:0};s.cache=s.cache||{};if(!s.active||!s.profiles.find(p=>p.id===s.active))s.active=s.profiles[0]?.id||null;return s}
function newP(o){return Object.assign({id:uid(),emoji:'🙂',name:'',stage:'middle',grade:'',goal:'',strengths:'',struggles:'',xp:0,streak:0,last:'',topics:{},weak:[],cards:[],chat:[],plans:[],path:null,pathDraft:null,weekly:null,exams:[],lib:[],pathChecked:''},o||{})}
function save(){if(!LS.set('fc_state',S)){S.cache={};LS.set('fc_state',S)}}
const cur=()=>{const n=S.profiles.filter(p=>p.name);return n.find(p=>p.id===S.active)||n[0]||null};
const hasKey=()=>!!LS.raw('fc_key');
const STAGES={elementary:'elementary school (ages 6-10)',middle:'middle school (ages 11-13)',high:'high school (ages 14-18)',college:'college/university student',adult:'adult learner'};
const STAGE_NAMES={elementary:'Elementary',middle:'Middle school',high:'High school',college:'College',adult:'Adult'};
function depth(p){return {elementary:'very simple words, tiny steps, concrete everyday examples, no jargon',middle:'simple clear language, short sentences, friendly examples, grade-level vocabulary',high:'clear but rigorous, standard high-school terminology, real-world and test-style examples',college:'college-level depth: precise terminology, derivations/reasoning, nuance and sources of error',adult:'adult-friendly, practical, respectful of prior life experience'}[p.stage]||'clear and simple'}
const level=p=>Math.floor(Math.sqrt((p.xp||0)/50))+1;

/* ================= privacy + AI ================= */
const SAFETY=`You are Family Coach, a warm, encouraging learning mentor. Rules: Content must be age-appropriate for the learner level given. Never ask for personal information (names, address, school, phone, photos, passwords). If the learner mentions feeling unsafe, hopeless, bullied, abused or being hurt, respond kindly, encourage them to talk to a trusted adult right now, and mention that in the US they can call or text 988 (Suicide & Crisis Lifeline), or call 911 in an emergency. Academic honesty: never write graded homework answers, take-home test answers, or application/college essays for the learner; teach, hint, ask guiding questions and give feedback instead. Be accurate and say when unsure. Keep language short and matched to the learner level.`;
function scrub(t){
  let s=str(t);const names=new Set();
  S.profiles.forEach(p=>{const n=str(p.name).trim();if(n.length>1){names.add(n);n.split(/\s+/).forEach(w=>{if(w.length>1)names.add(w)})}});
  [...names].sort((a,b)=>b.length-a.length).forEach(n=>{
    s=s.replace(new RegExp('(^|[^\\p{L}\\p{N}])'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![\\p{L}\\p{N}])','giu'),'$1the learner');
  });
  return s.replace(/[\w.+-]+@[\w-]+\.[\w.-]+/g,'[email]').replace(/\+?\d[\d\s().-]{8,}\d/g,'[number]');
}
const clean=t=>scrub(t).trim();
function ctx(p){return `Learner level: ${STAGES[p.stage]}; grade/year: ${p.grade||'n/a'}; goal: ${p.goal||'n/a'}; strengths: ${p.strengths||'n/a'}; struggles: ${p.struggles||'n/a'}; city/region: ${S.set.city||'unspecified'}; today: ${dkey()}. Depth guide: ${depth(p)}.`}
const RETRY_MS=()=>window.__fcFast?5:900;
function errMsg(e){
  const m=String(e&&e.message||e);
  if(m==='NOKEY')return '🔑 Paste your Gemini key in the Parent tab first.';
  if(m==='LIMIT')return '⏸️ Daily AI limit reached. A parent can raise it in the Parent tab.';
  if(/^HTTP 400/.test(m)&&/key/i.test(m))return '🔑 Google says the key is not valid. Check it in the Parent tab.';
  if(/^HTTP (401|403)/.test(m))return '🔑 Key rejected or the Gemini API is not enabled for it. Check the Parent tab.';
  if(/^HTTP 404/.test(m))return '🤖 Model name not found. Check the models in the Parent tab (see ai.google.dev/gemini-api/docs/models).';
  if(/^HTTP 429/.test(m)&&/quota/i.test(m))return '🪫 Google says this key has no free quota left for now. Try again later today or tomorrow.';
  if(/^HTTP 429/.test(m))return '🐢 Too many requests right now. Wait a minute and try again.';
  if(/^HTTP 503/.test(m))return '🐢 Google says the model is busy. Try again in a few minutes.';
  if(m==='BADJSON')return '😕 The AI answer was garbled. Please try again.';
  if(/Failed to fetch|NetworkError|TypeError/i.test(m))return '📡 Cannot reach Google. Check the internet connection.';
  return '⚠️ '+m.slice(0,200);
}
async function callGemini(body,model,fb){
  const key=LS.raw('fc_key');if(!key)throw new Error('NOKEY');
  const day=dkey();if(S.usage.day!==day)S.usage={day,calls:0,tokens:0};
  if(Number(S.set.limit)>0&&S.usage.calls>=Number(S.set.limit))throw new Error('LIMIT');
  if(S.noMainDay===dkey()&&model===S.set.model&&S.set.fast)model=S.set.fast;
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
  let last;
  for(let i=0;i<3;i++){
    try{
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body),signal:(typeof AbortSignal!=='undefined'&&AbortSignal.timeout)?AbortSignal.timeout(window.__fcTimeout||120000):undefined});
      if(r.ok){
        const j=await r.json();
        S.usage.calls++;S.usage.tokens+=j.usageMetadata?.totalTokenCount||0;save();
        LASTSRC=(j.candidates?.[0]?.groundingMetadata?.groundingChunks||[]).map(c=>c.web).filter(Boolean).slice(0,5);
        const parts=j.candidates?.[0]?.content?.parts||[];
        const text=parts.map(x=>x.text||'').join('').trim();
        if(!text){const why=j.promptFeedback?.blockReason||j.candidates?.[0]?.finishReason||'empty';throw new Error('The AI gave no answer ('+why+'). Try rephrasing.')}
        return text;
      }
      let msg='';try{msg=(await r.json()).error?.message||''}catch(e){}
      last=new Error('HTTP '+r.status+' '+msg);
      if(r.status===429&&/quota/i.test(msg)){
        if(body.tools){S.noSearchDay=dkey();save();delete body.tools;i=-1;continue}
        if(model!==S.set.fast&&S.set.fast){S.noMainDay=dkey();save();return callGemini(body,S.set.fast,true)}
      }
      if(![429,500,502,503,504].includes(r.status))throw last;
    }catch(e){
      if(e===last&&!/^HTTP (429|5)/.test(e.message))throw e;
      if(/^The AI gave no/.test(e.message))throw e;
      if(e&&(e.name==='TimeoutError'||e.name==='AbortError')){last=new Error('HTTP 503 no answer from Google within 2 minutes');if(model!==S.set.fast&&S.set.fast&&!fb)return callGemini(body,S.set.fast,true);throw last}
      last=e;
    }
    if(i<2)await new Promise(r=>setTimeout(r,RETRY_MS()*Math.pow(2,i)));
  }
  if(/^HTTP (429|503)/.test(String(last&&last.message))&&model!==S.set.fast&&!fb){toast('Main model is busy, using the fast model…');return callGemini(body,S.set.fast,true)}
  throw last;
}
function buildBody(prompt,o){
  const p=o.p||cur();
  const sys=scrub(SAFETY+' '+(p?ctx(p):'')+(o.sys?' '+o.sys:''));
  const contents=o.contents?o.contents.map(c=>({role:c.role,parts:[{text:scrub(c.text)}]})):[{role:'user',parts:[{text:scrub(prompt)}]}];
  const body={systemInstruction:{parts:[{text:sys}]},contents,generationConfig:{temperature:o.temp??0.6}};
  if(o.search&&S.noSearchDay!==dkey())body.tools=[{google_search:{}}];
  else if(o.json)body.generationConfig.responseMimeType='application/json';
  return body;
}
function parseJSON(t){
  t=str(t).replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim();
  try{return JSON.parse(t)}catch(e){}
  const a=t.search(/[\[{]/);if(a<0)throw new Error('BADJSON');
  const open=t[a],close=open==='{'?'}':']';const b=t.lastIndexOf(close);
  try{return JSON.parse(t.slice(a,b+1))}catch(e){throw new Error('BADJSON')}
}
async function aj(prompt,o={}){ /* JSON answer; saved answers reused */
  const model=o.fast?S.set.fast:S.set.model;
  const body=buildBody(prompt,Object.assign({json:true},o));
  const ck=o.nocache?null:hash(model+JSON.stringify(body));
  if(ck&&S.cache[ck]&&Date.now()-S.cache[ck].t<(o.search?2:30)*864e5){try{return parseJSON(S.cache[ck].v)}catch(e){}}
  let text,obj;
  for(let k=0;k<2;k++){text=await callGemini(body,model);try{obj=parseJSON(text);break}catch(e){if(k)throw e}}
  if(ck){S.cache[ck]={t:Date.now(),v:text};const ks=Object.keys(S.cache);if(ks.length>150){ks.sort((a,b)=>S.cache[a].t-S.cache[b].t).slice(0,ks.length-120).forEach(k=>delete S.cache[k])}save()}
  return obj;
}
async function at(prompt,o={}){return callGemini(buildBody(prompt,o),o.fast?S.set.fast:S.set.model)} /* plain text */

/* ================= speech ================= */
function speak(text,code){
  try{
    const ss=window.speechSynthesis;if(!ss){toast('Read-aloud is not supported in this browser',true);return}
    ss.cancel();const u=new SpeechSynthesisUtterance(str(text));u.lang=code||'en-US';u.rate=0.9;
    const v=ss.getVoices().find(v=>v.lang.toLowerCase().startsWith((code||'en').slice(0,2).toLowerCase()));
    if(v)u.voice=v;else if(code&&!code.startsWith('en')&&ss.getVoices().length)toast('No voice installed for this language in your browser/computer',true);
    ss.speak(u);
  }catch(e){toast('Read-aloud failed',true)}
}
function listen(lang,cb){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Microphone input is not supported here. Use Edge or Chrome.',true);return false}
  const r=new SR();r.lang=lang;r.interimResults=false;r.maxAlternatives=1;
  r.onresult=e=>{cb(e.results[0][0].transcript)};
  r.onerror=e=>{toast('Microphone: '+e.error,true)};
  r.onend=()=>{U.listening=false;render()};
  try{r.start();U.listening=true;render();return true}catch(e){toast('Could not start the microphone',true);return false}
}
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];}for(let j=0;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
const norm=s=>str(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\p{L}\p{N}]/gu,'');
function sim(a,b){a=norm(a);b=norm(b);if(!a&&!b)return 100;return Math.round(100*(1-lev(a,b)/Math.max(a.length,b.length,1)))}

/* ================= progress ================= */
function addXP(n,p){p=p||cur();if(!p)return;p.xp+=n;const t=dkey();
  if(p.last!==t){p.streak=(p.last===addDays(t,-1))?p.streak+1:1;p.last=t}
  save();toast('+'+n+' XP ⭐')}
function addWeak(p,topic,q){topic=clean(topic).slice(0,60);q=clean(q).slice(0,120);
  let w=p.weak.find(x=>x.topic===topic&&x.q===q);if(w)w.miss++;else p.weak.unshift({id:uid(),topic,q,miss:1});p.weak=p.weak.slice(0,30);save()}
function fixWeak(p,topic){const w=p.weak.find(x=>x.topic===topic);if(w){w.miss--;if(w.miss<=0)p.weak=p.weak.filter(x=>x!==w);save()}}
const dueCards=(p,lang)=>p.cards.filter(c=>c.due<=dkey()&&(!lang||c.lang===lang));
const BOX=[0,1,2,4,8,16,32];

/* ================= language data ================= */
const LANGS={
 Spanish:{code:'es-ES',flag:'🇪🇸',letters:'A B C D E F G H I J K L M N Ñ O P Q R S T U V W X Y Z'.split(' '),starter:[['hola','hola','hello'],['gracias','gracias','thank you'],['por favor','por favor','please'],['adiós','adios','goodbye'],['sí','si','yes'],['no','no','no'],['agua','agua','water'],['buenos días','buenos dias','good morning']]},
 Tamil:{code:'ta-IN',flag:'🇮🇳',letters:'அ ஆ இ ஈ உ ஊ எ ஏ ஐ ஒ ஓ ஔ க ச த ப ம'.split(' '),starter:[['வணக்கம்','vanakkam','hello'],['நன்றி','nandri','thank you'],['ஆம்','aam','yes'],['இல்லை','illai','no'],['தண்ணீர்','thanneer','water'],['அம்மா','amma','mother'],['அப்பா','appa','father'],['நல்லது','nalladhu','good']]},

async function doLearn(topic){
  const p=cur();topic=clean(topic);if(!topic)return toast('Type a topic first',true);
  U.m.learnTopic=topic;
  const mark=()=>{p.topics[topic]=Object.assign({t:Date.now(),n:0,ok:0,tot:0},p.topics[topic],{t:Date.now()});p.topics[topic].n++;addXP(5)};
  const it=libFind(p,topic);
  if(it&&it.lesson&&it.status!=='failed'){U.lesson=Object.assign({},it.lesson,{videos:null,sel:null});mark();render();window.scrollTo(0,0)}
  else await run('Making your lesson…',async()=>{
    U.lesson=await buildLesson(topic,p);libPut(p,topic,it?it.group:'My topics',U.lesson);mark();
  });
  if(!U.lesson||U.lesson.topic!==topic)U.lesson={topic,idea:'',cards:[],harder:[],demos:[],videos:[],src:[]};
  loadWiki(topic);
  if(U.lesson.cards.length)loadVideos(topic,p);
}
async function loadWiki(topic){
  const L=U.lesson;
  try{
    const r=await fetch('https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=1&prop=extracts&exintro=1&explaintext=1&exsentences=4&gsrsearch='+encodeURIComponent(topic));
    const j=await r.json();const pg=Object.values(j.query?.pages||{})[0];
    if(pg&&pg.extract)L.wiki={title:pg.title,text:pg.extract,url:'https://en.wikipedia.org/wiki/'+encodeURIComponent(pg.title.replace(/ /g,'_'))};
  }catch(e){}
  if(U.lesson===L&&U.tab==='learn')render();
}
async function loadVideos(topic,p){
  const L=U.lesson;
  try{
    const r=await aj(`Use Google Search to find 3 free, real YouTube videos that teach "${topic}" clearly for this learner level (reputable educational channels such as Khan Academy, CrashCourse, 3Blue1Brown, TED-Ed, Organic Chemistry Tutor, etc.). Return ONLY JSON: {"videos":[{"title":"","url":"https://www.youtube.com/watch?v=..."}]}`,{fast:true,search:true,p});
    L.videos=arr(r.videos).map(v=>({title:str(v.title),id:ytId(v.url||v.id)})).filter(v=>v.id).slice(0,4);
  }catch(e){L.videos=[]}
  if(U.lesson===L&&U.tab==='learn')render();
}

views.practice=p=>{
  const P=U.pr;
  if(!P){
    return `<div class="card"><h2>✏️ Practice</h2>${inp('prTopic','What do you want to practice?','prStart')}
    <div class="mut">Difficulty adapts to you. Mistakes become weak spots.</div>
    ${p.weak.slice(0,5).map(w=>`<button class="tag" data-a="weakGo" data-t="${esc(w.topic)}">${esc(w.topic)}</button>`).join('')}
    <br><button class="btn big" data-a="prStart">▶️ Start</button></div>`;
  }
  const q=P.q[P.i];
  if(!q)return `<div class="card"><p>Getting your next question…</p><button class="btn" data-a="prNext">Next</button></div>`;
  const stars='⭐'.repeat(P.d)+'☆'.repeat(5-P.d);
  return `<div class="card"><div class="row"><b>${esc(P.topic)}</b><span class="stars">${stars}</span><span>✅ ${P.ok}/${P.tot}</span></div>
  <h2>${esc(q.q)}</h2>
  ${q.type==='mcq'?q.options.map((o,i)=>`<button class="opt ${P.checked?(i===q.answer?'ok':(i===P.sel?'no':'')):(i===P.sel?'sel':'')}" data-a="prSel" data-i="${i}" ${P.checked?'disabled':''}>${esc(o)}</button>`).join(''):`<input data-m="prNum" value="${M('prNum')}" placeholder="Type your number" data-en="prCheck" inputmode="decimal" ${P.checked?'disabled':''}>`}
  ${P.hint&&!P.checked?`<div class="fb info">💡 ${esc(q.hint||'Think about the first step.')}</div>`:''}
  ${P.fb?`<div class="fb ${P.fb.ok?'ok':'no'}">${P.fb.ok?'🎉 Correct!':'❌ Not quite.'} ${esc(q.explain||'')}${P.fb.ok?'':`<br><b>Answer:</b> ${esc(q.type==='mcq'?q.options[q.answer]:q.answer)}`}</div>`:''}
  ${!P.checked?`<button class="btn big" data-a="prCheck">Check ✔️</button><button class="btn alt" data-a="prHint">💡 Hint</button>`:`<button class="btn big" data-a="prNext">Next ➡️</button>`}
  <button class="btn alt" data-a="prStop">🏁 Finish</button></div>`;
};
const tex=t=>str(t).replace(/\\[dt]?frac\{([^{}]*)\}\{([^{}]*)\}/g,'$1/$2').replace(/\\times/g,'×').replace(/\\div/g,'÷').replace(/\\cdot/g,'·').replace(/\$/g,'').replace(/\\[()\[\]]/g,'');
function normQs(r){const R=r;r={questions:arr(R.questions).map(q=>q&&typeof q==='object'?Object.assign({},q,{q:tex(q.q),options:arr(q.options).map(tex),hint:tex(q.hint),explain:tex(q.explain),answer:typeof q.answer==='string'?tex(q.answer):q.answer}):q)};
  return arr(r.questions).map(q=>{
    const o=arr(q.options).map(str);let type=(o.length>=2&&q.type!=='num')?'mcq':'num';
    if(type==='mcq'){let a=Number(q.answer);if(!Number.isInteger(a)){a=o.findIndex(x=>norm(x)===norm(q.answer))}if(a<0||a>=o.length)return null;return {q:str(q.q),type,options:o,answer:a,hint:str(q.hint),explain:str(q.explain)}}
    const a=parseNum(str(q.answer));if(a==null)return null;return {q:str(q.q),type:'num',answer:a,hint:str(q.hint),explain:str(q.explain)};
  }).filter(q=>q&&q.q);
}
function parseNum(s){s=str(s).replace(/,/g,'').replace(/\s+/g,'').replace(/%$/,'');let m=s.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);if(m&&Number(m[2]))return Number(m[1])/Number(m[2]);if(/^-?(\d+\.?\d*|\.\d+)(e-?\d+)?$/i.test(s))return Number(s);return null}
async function fetchQs(P,p){
  const r=await aj(`Write 3 practice questions about "${P.topic}" at difficulty ${P.d} out of 5 for this learner (variation ${Math.random().toString(36).slice(2,6)}). Mix multiple-choice and numeric-answer questions. Return ONLY JSON: {"questions":[{"q":"","type":"mcq or num","options":["","","",""],"answer":"for mcq the 0-based index of the right option; for num the number only","hint":"a hint that does not give the answer","explain":"short explanation"}]}. Plain text only; numeric answers must be a single number (decimal or fraction).`,{p,nocache:true});
  const qs=normQs(r);if(!qs.length)throw new Error('BADJSON');P.q.push(...qs);
}
async function prStart(topic){
  const p=cur();topic=clean(topic);if(!topic)return toast('Type a topic first',true);
  U.pr={topic,d:p.stage==='elementary'?1:2,q:[],i:0,ok:0,tot:0,run:0,sel:null,checked:false,hint:false,fb:null};
  p.topics[topic]=Object.assign({t:Date.now(),n:0,ok:0,tot:0},p.topics[topic]);
  await run('Writing your questions…',async()=>{try{await fetchQs(U.pr,p)}catch(e){U.pr=null;throw e}});
}
function prCheck(){
  const p=cur(),P=U.pr,q=P?.q[P.i];if(!q||P.checked)return;
  let ok;
  if(q.type==='mcq'){if(P.sel==null)return toast('Pick an answer',true);ok=P.sel===q.answer}
  else{const v=parseNum(U.m.prNum);if(v==null)return toast('Type a number',true);ok=Math.abs(v-q.answer)<=Math.max(0.01,Math.abs(q.answer)*1e-6)}
  P.checked=true;P.fb={ok};P.tot++;const t=p.topics[P.topic];if(t)t.tot++;
  if(ok){P.ok++;P.run++;if(t)t.ok++;addXP(P.hint?5:10);fixWeak(p,P.topic);if(P.run>=2&&P.d<5){P.d++;P.run=0}}
  else{P.run=0;if(P.d>1)P.d--;addWeak(p,P.topic,q.q);save()}
  save();render();
}
async function prNext(){
  const P=U.pr,p=cur();P.i++;P.sel=null;P.checked=false;P.hint=false;P.fb=null;U.m.prNum='';
  if(P.i>=P.q.length){await run('Next question…',async()=>{try{await fetchQs(P,p)}catch(e){P.i--;P.checked=true;P.fb={ok:false};throw e}})}
  else render();
}

const CRISIS=/\b(kill myself|suicid|want to die|hurt myself|self[- ]harm|being abused|abuse me|hit me|hurting me|don'?t want to live)\b/i;

async function sendChat(){
  const p=cur();const t=clean(U.m.chatIn);if(!t)return;U.m.chatIn='';
  p.chat.push({r:'u',t});
  if(CRISIS.test(t))p.chat.push({r:'m',t:'💛 I am really glad you told me. Please talk to a trusted adult right now (a parent, teacher or counselor). In the US you can call or text 988 any time, and call 911 if you are in danger.'});
  p.chat=p.chat.slice(-60);save();
  await run('Mentor is thinking…',async()=>{
    const hw=S.set.hw==='hints'?'For homework, assignments or test questions, give hints and guiding questions first and NEVER the final answer; ask the learner to try the next step and show their work.':'For homework, explain the method with a similar example, then let the learner do their own problem.';
    const hist=p.chat.slice(-12).filter(m=>!(m.t.startsWith('💛 I am really glad'))).map(m=>({role:m.r==='u'?'user':'model',text:m.t}));
    while(hist.length&&hist[0].role!=='user')hist.shift();
    const reply=await at('',{contents:hist,p,temp:0.7,search:!!S.set.research,sys:`Act like a caring parent-teacher-advisor chatting with the learner. ${hw} Reply in under 90 words, plain text, one concrete next step per reply,${S.set.research?' use Google Search when facts could have changed (rules, dates, prices, news, exams, admissions),':''} finishing with one short question or action.`});
    p.chat.push({r:'m',t:reply,src:S.set.research?LASTSRC.slice():[]});p.chat=p.chat.slice(-60);addXP(2,p);
  });
  setTimeout(()=>{const c=$('#chat');if(c)c.scrollTop=c.scrollHeight},0);
}

function lgCards(p,lang){return p.cards.filter(c=>c.lang===lang)}
views.lang=p=>{
  const g=U.lg,L=LANGS[g.lang],modes=[['learn','📖 Words'],['cards','🃏 Cards'],['say','🎤 Say it'],['trace','✍️ Trace'],['dialog','💬 Dialogue']];

  <div style="margin-top:8px">${modes.map(([k,l])=>`<button class="btn ${g.mode===k?'':'alt'} sm" data-a="lgMode" data-k="${k}">${l}</button>`).join('')}</div></div>`+lgBody(p,g,L);
};
function lgBody(p,g,L){
  const code=L.code;
  if(g.mode==='learn'){
    const w=g.words||[];
    return `<div class="card"><h3>New words</h3>${inp('lgTopic','Topic (e.g. food, family, at school)','lgLearn')}<button class="btn" data-a="lgLearn">✨ Get words</button><button class="btn alt" data-a="lgStarter">➕ Add starter words</button></div>
    ${w.length?`<div class="card">${w.map(x=>wordRow(x,code)).join('')}<button class="btn" data-a="lgAddAll">➕ Add all to my cards</button></div>`:''}`;
  }
  if(g.mode==='cards'){
    const due=dueCards(p,g.lang),c=due.find(x=>x.id===g.card)||due[0];
    if(!lgCards(p,g.lang).length)return `<div class="card"><p>No ${g.lang} cards yet.</p><button class="btn" data-a="lgStarter">➕ Add starter words</button></div>`;
    if(!c)return `<div class="card"><h2>🎉 All done for today!</h2><p class="mut">${lgCards(p,g.lang).length} cards saved. Next review is scheduled automatically.</p></div>`;
    return `<div class="card" style="text-align:center"><div class="mut">${due.length} due</div><div class="native">${esc(c.n)}</div>${sp(c.n,code)}

  ${D?`<div class="card">${D.map((x,i)=>`<p><b>${esc(x.who)}:</b> <span style="font-size:24px">${esc(x.n)}</span> ${sp(x.n,code)}<br><span class="mut">${esc(x.r)} — ${esc(x.m)}</span></p>`).join('')}<button class="btn alt" data-a="dlgPlay">▶️ Play all</button></div>`:''}`;

const wordRow=(x,code)=>`<div class="row" style="border-bottom:1px solid var(--line);padding:6px 0"><div><span style="font-size:28px">${esc(x.n)}</span> ${sp(x.n,code)}<br><span class="mut">${esc(x.r)} — ${esc(x.m)}</span>${x.ex?`<br><i class="mut">${esc(x.ex)}</i>`:''}</div></div>`;
function addCards(p,lang,words){let n=0;words.forEach(w=>{if(!w.n||p.cards.some(c=>c.lang===lang&&c.n===w.n))return;p.cards.push({id:uid(),lang,n:str(w.n),r:str(w.r),m:str(w.m),box:0,due:dkey()});n++});save();return n}
function initTrace(){
  const cv=$('#cv');if(!cv)return;const c=cv.getContext('2d');
  c.fillStyle='rgba(120,120,160,.25)';c.font='230px sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(cv.dataset.l,160,170);
  c.strokeStyle=getComputedStyle(document.body).color;c.lineWidth=10;c.lineCap='round';c.lineJoin='round';
  let d=false;const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.onpointerdown=e=>{d=true;const [x,y]=pos(e);c.beginPath();c.moveTo(x,y);c.lineTo(x+.1,y+.1);c.stroke();cv.setPointerCapture(e.pointerId)};
  cv.onpointermove=e=>{if(!d)return;const [x,y]=pos(e);c.lineTo(x,y);c.stroke()};
  cv.onpointerup=cv.onpointercancel=()=>{d=false};
}
async function scoreSpeech(heard){
  const p=cur(),g=U.lg,L=LANGS[g.lang];const pool=lgCards(p,g.lang);const s=g.say||(pool[0]||{n:L.starter[0][0],r:L.starter[0][1],m:L.starter[0][2]});
  let score=Math.max(sim(heard,s.n),sim(heard,s.r)),fb='';
  try{
    const r=await aj(`A learner of ${g.lang} tried to say "${s.n}" (${s.r}, meaning "${s.m}"). Speech recognition heard: "${clean(heard)}". Score pronunciation/recognition match 0-100 and give one encouraging tip. Return ONLY JSON: {"score":0,"feedback":""}`,{fast:true,p,nocache:true,temp:0.2});
    if(Number.isFinite(Number(r.score)))score=Math.max(0,Math.min(100,Math.round(Number(r.score))));fb=str(r.feedback);
  }catch(e){fb='(Scored offline by letter match. '+errMsg(e).replace(/^[^\s]+\s/,'')+')'}
  g.res={heard:clean(heard),score,feedback:fb};if(score>=70)addXP(5,p);render();
}

  delProf:d=>{if(!confirm('Delete this learner and all their progress?'))return;S.profiles=S.profiles.filter(x=>x.id!==d.id);if(S.active===d.id)S.active=S.profiles[0]?.id||null;save();render()},
  backup:()=>{const inc=$('#bkKey')?.checked;const data={app:'FamilyCoach',v:1,date:new Date().toISOString(),state:Object.assign({},S,{cache:{}}),key:inc?LS.raw('fc_key'):undefined};
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='FamilyCoach-backup-'+dkey()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup downloaded 💾')}
};
function restoreFile(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=='FamilyCoach'||!d.state)throw 0;if(!confirm('Replace everything in this browser with the backup?'))return;S=normState(d.state);if(d.key)LS.setRaw('fc_key',d.key);save();toast('Restored ✅');render()}catch(x){toast('That is not a Family Coach backup file',true)}};
  r.readAsText(f);
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f){const r=f(el.dataset,el);if(r&&r.catch)r.catch(x=>toast(errMsg(x),true))}});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.m;if(k)U.m[k]=e.target.value});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.m;if(k)U.m[k]=e.target.value});
document.addEventListener('keydown',e=>{const k=e.target.dataset&&e.target.dataset.en;if(k&&e.key==='Enter'){e.preventDefault();U.m[e.target.dataset.m]=e.target.value;const f=A[k];if(f)f({},e.target)}});
window.FC={get S(){return S},U,A,render};
setInterval(builderTick,BG_MS);setTimeout(builderTick,Math.min(BG_MS,5000));
if(!cur())U.tab='parent';
if(!S.profiles.length){const q=newP({name:''});S.profiles.push(q);U.editing=q.id}
render();
</script>
