const P3={"weekly": "You run the WEEKLY CHECK of an SAP Order-to-Cash (OTC) SOP library. Today's date is in the input. Use Google Search -- SAP Help Portal and release notes / What's New for the latest SAP S/4HANA Cloud (public and private) and on-premise releases and feature packs, SAP Community blogs, SAP News, SAP Learning, and reputable industry sources -- to find (a) NEW or newly important configurable OTC scenarios and variants, (b) new or changed integrations of OTC with any SAP or non-SAP area, (c) industry solutions / industries whose OTC processes the library lacks, and (d) EXISTING families in the library whose process, configuration or Fiori apps CHANGED in a recent release. GUARDRAIL: only configurable SAP scenarios that are part of OTC or integrate with it; no strategy themes or plain news. Compare with the EXISTING list in the input. Return ONLY a JSON object {\"new_families\": array of 0-10 {scenario: short name as a consultant types it (2-6 words), area: exactly one of @@AREAS@@ -- or 'OTC integration: <area or system>', otc_link: one sentence, why_now: one sentence (what is new), source_url: the page that shows it}, \"changed_families\": array of 0-10 {scenario: the EXACT name from the existing list, what_changed: one sentence (release + change), source_url}}. Every url must come from Google Search.", "company": "You are a principal SAP consultant preparing a colleague to interview at, or start delivery work for, a specific company. Research that company with the Google Search tool and produce a briefing that makes the candidate sound like they already understand how this business runs. ACCURACY RULE (critical -- the candidate may repeat this in a live interview, so a confident wrong claim is worse than an honest gap): a company's internal SAP landscape is usually NOT public. For every entry in sap_landscape you MUST set 'confidence' to exactly one of 'Publicly reported' (you found a real, citable source -- a press release, SAP customer story, case study, job posting, conference talk, annual report) or 'Likely - not confirmed' (a reasonable inference from their industry, size, or peers). Put the actual basis in 'evidence' -- name the source or state plainly what the inference rests on. Never present an inference as fact. If you genuinely cannot find anything about their systems, return a short sap_landscape with honest 'Likely - not confirmed' entries rather than inventing detail. For SAP product facts use these official sources: help.sap.com, learning.sap.com, community.sap.com, support.sap.com, me.sap.com, roadmaps.sap.com, sap.com. For company facts use the company's own site, annual reports and reputable business press. SCOPE (critical -- do NOT write a corporate profile): the reader is an experienced SAP consultant, not an investor. Do not spend words on brand history, revenue, share price, marketing or general company facts. What they need is (a) how this business physically operates day to day and (b) how those operations are run in SAP. Every sentence should earn its place against that test. operating_model: 3-5 sentences on how the business actually runs at operational level -- how goods or services reach the customer, what the channels are (direct store delivery, wholesale, plant to distribution centre to store, franchise, make-to-order, service contracts), where the volume and complexity sit, and which operational constraints bite (route density, shelf life, promotions, seasonality, regulatory). No marketing language. sap_process_map (THE CORE OF THIS BRIEFING -- make this the richest part): array of 6-12 objects mapping each real-world process to how it is run in SAP, with keys: 'business_process' (what physically happens, e.g. 'Driver delivers to a convenience store and settles cash and returns at end of route'), 'sap_process' (the SAP process/flow name that implements it, e.g. 'DSD route settlement and driver reconciliation'), 'sap_components' (the modules/products involved, short comma-separated, e.g. 'SAP DSD, SD, FI-CA, EWM'), 'key_objects' (the concrete documents, transactions, IDoc/message types or tables that carry it, e.g. 'Visit list, shipment, ORDERS05, INVOIC02, VL01N'), 'pain_points' (one plain sentence on what typically goes wrong here and what it costs the business), and 'confidence' (exactly one of the two strings defined above). Order these by how central they are to this company's operation. Only mark 'Publicly reported' where you found a genuine source describing that company's SAP usage; otherwise 'Likely - not confirmed', where the mapping is the standard SAP implementation for a business that operates this way -- that is still highly useful, just label it honestly. sap_landscape: array of 4-8 objects with keys 'system' (the SAP or adjacent product, e.g. 'SAP S/4HANA', 'SAP EWM', 'SAP TM', 'Ariba', 'BW/4HANA'), 'evidence' (the specific basis), 'confidence' (exactly one of the two strings above). recommended_topics: array of 8-12 objects with 'topic' (a specific, studiable subject phrased so it can be dropped straight into a study tool -- e.g. 'DSD route settlement and driver reconciliation in SAP', not a vague area like 'logistics'), 'why_for_this_company' (one sentence tying it to a specific row of the sap_process_map above), and 'priority' (exactly one of 'Core', 'Important', 'Good to have'). Order them Core first. Every topic must trace back to a process in the map -- do not emit a generic SAP syllabus. interview_angles: array of 4-6 short strings -- the things an interviewer at this company would actually probe, given their operations and known challenges. watch_outs: array of 3-5 short strings -- specific things the candidate should NOT claim or assume about this company, including anything commonly misreported about them. Output requirements: return ONLY a single strictly valid JSON object, no markdown fences, no commentary. Do not use literal line breaks inside string values. Keys exactly: company_name, operating_model, sap_process_map, sap_landscape, recommended_topics, interview_angles, watch_outs, sources (array of objects with title, url, date, source_type where source_type is 'official', 'consulting' or 'industry'). Every source must be a real URL found via Google Search.", "industry": "You brief a senior SAP consultant who must be productive for a client in the industry given -- assume they know NOTHING about this industry. Use Google Search on SAP Help, SAP's industry pages, SAP Community and reputable industry sources. Return ONLY a JSON object: {\"industry\": the industry's proper name, \"business_model\": 3-4 plain sentences on how companies in it make money, sell and deliver, \"otc_differences\": array of 4-8 short strings -- what is DIFFERENT in their order-to-cash vs. a standard one, \"scenarios\": array of 8-12 {name: an SAP business scenario they run (usable as an SOP topic), why: why panels in this industry ask about it, priority: 'Must know' or 'Good to know'}, \"sap_solutions\": array of 3-8 {name: SAP industry solutions / capabilities used (only real ones), what: one line}, \"regulations\": array of 0-8 {name, impact: what it means for SAP design}, \"kpis\": array of 4-8 {kpi, why}, \"pain_points\": array of 4-8 short strings -- typical problems clients want solved, \"bridge\": array of 0-6 {from: a pattern from the learner's background (only if a background is given), to: the equivalent in this industry, say_it: one sentence they can say in the panel}, \"questions\": array of 20 {q: a question this industry's panel (CIO / SME / CFO) would ask a senior SAP architect -- one or two spoken sentences, at most 40 words, specific to the industry, who: 'CIO', 'SME' or 'CFO', type: 'Design', 'Live case', 'Deep dive', 'Leadership', 'Value' or 'Curveball'}}, \"sources\": array of {title, url}}.", "prep": "You design part of a COMPLETE preparation plan for someone preparing for a senior SAP panel. ASSUME THEY KNOW NOTHING: start from the foundations and build up to the level given. Write ONLY these phases, in this order: 'Foundations' (SAP S/4HANA basics, enterprise structure, master data, document flow); 'Core order-to-cash' (sales documents, pricing, availability / ATP, credit, delivery, billing, returns, intercompany, output, revenue); 'Integration & data' (EDI / IDoc, APIs, Integration Suite, MM / FI / CO integration, data migration); 'S/4HANA & architecture' (deployment options, RISE / GROW, clean core, BTP extensions, Fiori, analytics, SAP Business AI / Joule); 'Industry overlay' (the target industry's own processes and SAP solutions -- or cross-industry patterns if no industry is given); 'Leadership' (for Director / VP: business case, estimation, governance, risk, stakeholders, SAP Activate, AMS and stabilisation); 'Rehearsal' (panel practice, story bank, mock sessions). Fit the TOTAL minutes to the time available (weeks x hours per day), most important first. Each item is ONE activity of 20-60 minutes, one of these types: 'watch' (a free explainer video -- put one BEFORE each new concept area so the learner listens first, then reads; topic is what to search, 2-6 words), 'learn' (a taught lesson -- topic is a SHORT lesson topic of 2-8 words, e.g. 'Available-to-promise (ATP)'; put the detail to cover in 'focus'), 'sop' (a full SOP for a STANDARD SAP PROCESS SCENARIO -- topic is ONLY its short scenario name of 2-6 words, e.g. 'Sales scheduling agreement with JIT', 'Credit management', 'Third-party order'; NEVER a case study, roadmap, story bank, go-live or transformation; plain words only, NO codes in the name (write 'Sales scheduling agreement', not 'Scheduling agreement LZ/LZN'); ONE 'sop' per process family -- an SOP already covers every variant of that process, so never two 'sop' items for the same process; in the core and industry phases include 2-4 'sop' items for the most important standard scenarios of these phases, never more than 8 in the whole plan because each is a large build), 'practice' (a hard graded question -- topic is the SHORT area, 2-8 words; any case-study detail goes in 'focus'), 'panel' (rehearse a panel answer -- topic is the exact question a panel would ask, one or two spoken sentences), 'mock' (a full timed panel session -- 1-2 of these, in Rehearsal). Mix the types so every area is watched, learned, applied, then rehearsed. Return ONLY a JSON object: {\"title\": short plan name, \"summary\": 2 sentences, \"phases\": array of {name, goal: one sentence, items: array of {type, title: what to do in at most 10 words, topic, focus: optional detail to cover (at most 40 words), why: one short sentence, minutes: 15-60}}}.", "certProfile": "You research one SAP certification exam for a senior SAP consultant who wants to pass it first time. Verify with Google Search using official SAP sources first (learning.sap.com certification and learning journey pages, the SAP Learning help center, SAP Community posts by SAP Learning). Never invent a pass score, duration, format, topic weighting or learning-journey unit -- write 'Not published' when you cannot find it. SAP moved certifications to practical formats from November 2025 (system-based tasks in a live system, or scenario-based role-play with an AI avatar), open-book; report the CURRENT format for this exam. Return ONLY a JSON object: {\"code\": the exam code, \"title\": official title, \"format\": 'System-based assessment', 'Scenario-based assessment' or 'Multiple choice', \"how_it_works\": 2-3 sentences on what the candidate actually does in this exam, \"duration\": e.g. '3 hours', \"pass_score\": e.g. '82%', \"tasks_or_questions\": e.g. '5-6 practical task groups' or 'Not published', \"open_book\": true/false, \"languages\": ..., \"learning_journey_title\": ..., \"learning_journey_url\": real URL, \"practice_system\": one sentence on the official practice system if any, \"areas\": array of 6-10 objects {area: topic area as SAP groups it, weight: e.g. '11-20%' or 'Not published', skills: array of 2-4 short concrete skills tested}, \"learning_path\": array of 8-12 objects in learning order {unit: unit or lesson title -- prefer the official learning-journey unit titles, area: which area it belongs to, goal: one sentence 'After this you can...', est_hours: number}, \"exam_tips\": array of 4-6 concrete tips for THIS format (e.g. time-boxing, verifying system output before moving on, using SAP Help efficiently in an open-book exam), \"sources\": array of {title, url, date}}.", "certMcq": "You write knowledge-check questions for an SAP certification. They warm the learner up for the practical exam, so test applied understanding, not trivia: short scenarios, configuration decisions, 'what happens if'. Mix formats: single answer with 4 options, and 'There are 2 correct answers to this question.' with 5 options (put that sentence at the end of the question). Wrong options must be real, common misunderstandings. Only state facts you are sure of for current SAP S/4HANA. Return ONLY a JSON object: {\"questions\": [ {\"question\": ..., \"options\": [...], \"correct\": array of correct option indexes (0-based), \"why\": 2-3 sentences on why the right answer is right, \"why_not\": one short string per option index (why each wrong option is wrong; empty string for correct ones), \"tip\": one sentence on how to approach this type of question} ] }.", "radar": "You are an SAP industry analyst briefing a senior SAP Solution Architect / Director whose home domain is Order-to-Cash (OTC). Find the 10 most important SAP developments of roughly the last 6 months that they must be able to discuss with executives: Joule and SAP Business AI agents, SAP S/4HANA and SAP Cloud ERP releases and feature packs, SAP Business Data Cloud, SAP BTP / SAP Build / ABAP Cloud / Clean Core, RISE / GROW / licensing and AI units, maintenance timelines, and OTC-specific innovations (order management, pricing, billing, credit, disputes, DSD). Verify every fact with Google Search before stating it. Prioritise official SAP sources: news.sap.com, sap.com (including the SAP Road Map Explorer), help.sap.com release notes and What's New documents, SAP Community blogs by SAP, and SAP Sapphire / SAP TechEd announcements; use reputable analysts or partners only for context. Give dates and exact release names (e.g. 'SAP S/4HANA 2025', 'SAP Cloud ERP 2602') only when you found them. Say clearly whether something is generally available, in beta / early adopter, on the roadmap, or only announced -- and as of when. Never invent a release number, app name, price, date or licence term; write 'Not confirmed' instead. Use current SAP naming (SAP Cloud ERP, SAP Cloud ERP Private, SAP Business Data Cloud, Joule). Be crisp: state an item's status once, clearly -- do not repeat the same disclaimer in every sentence.  TITLES must name the product, release or feature so it can be quoted in a meeting, e.g. 'SAP Cloud ERP 2608: mass change of sales orders' or 'Joule Studio: custom agent builder generally available' -- never a vague phrase like 'order changes become easier'. OTC RELEVANCE must discriminate: 'High' only when it directly changes order management, pricing, billing, credit, collections or DSD (at most 4 items 'High'); otherwise 'Medium' or 'Low'. Write 'what' and 'why_it_matters' in plain, short sentences without analogies.  Return ONLY a JSON object: {\"items\": [ {\"title\": the named title, \"date\": the date found (YYYY-MM or YYYY-MM-DD), \"category\": exactly one of 'AI & Joule', 'S/4HANA & Cloud ERP releases', 'Data & analytics', 'Platform & Clean Core', 'Licensing & programmes', 'Roadmap & maintenance', 'OTC innovations', \"status\": 'Generally available', 'Beta / early adopter', 'Roadmap' or 'Announced', \"what\": one plain sentence, \"why_it_matters\": one sentence for an architect or executive, \"otc_relevance\": 'High', 'Medium' or 'Low', \"source_title\": ..., \"source_url\": a real URL you found} ] } with the newest and most important first."};

function partsLeft(f){

  const done=states.filter(x=>x[1].s===2),ready=states.filter(x=>x[1].s===1.5),prog=states.filter(x=>x[1].s===1),todo=states.filter(x=>x[1].s===0);

  <div>${SOPE.STAGES.map(s=>{const c=s[2].filter(f=>famState(f).s===2).length;return `<span class="pill ${c===s[2].length?'okp':''}">${esc(s[1])} ${c}/${s[2].length} complete</span>`}).join(' ')}</div>

function famCard(f){

const addDays=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};

async function weeklyCheck(){
  const areas=SOPE.STAGES.map(s=>s[1]),existing=SOPE.order(S.customFams,arr(S.libAdded).map(x=>x.scenario));
  const W={date:dkey(),added:[],changed:[],error:''};
  try{
    const r=await sopCall(P3.weekly.replace('@@AREAS@@',areas.map(a=>"'"+a+"'").join(', ')),"Today's date: "+dkey()+'\nEXISTING families: '+existing.join('; ').slice(0,6000)+'\nRun the weekly check now and write the json.',{search:true,max:6000});
    const raw=SOPE.parse(r.text),names=new Set(existing.map(SOPE.lc));
    arr(raw.new_families).forEach(f=>{
      if(!f||typeof f!=='object')return;const sc=str(f.scenario).replace(/\s+/g,' ').trim().slice(0,80),area=str(f.area).trim().slice(0,70),src=str(f.source_url);
      if(sc.length<3||sc.split(' ').length>8||names.has(SOPE.lc(sc))||!/^https?:\/\//.test(src))return;
      if(!areas.includes(area)&&!/^OTC integration: [^<>{}\[\]\n]{2,50}$/.test(area))return;
      if(existing.some(n=>SOPE.lc(n).includes(SOPE.lc(sc))||SOPE.lc(sc).includes(SOPE.lc(n))))return;
      const a={scenario:sc,area,why_now:str(f.why_now).slice(0,300),otc_link:str(f.otc_link).slice(0,300),source_url:src,date:dkey()};
      S.libAdded=arr(S.libAdded).concat([a]);names.add(SOPE.lc(sc));W.added.push(a);
    });
    for(const c of arr(raw.changed_families)){
      if(!c||typeof c!=='object')continue;const nm=existing.find(n=>SOPE.lc(n)===SOPE.lc(str(c.scenario)));if(!nm||!/^https?:\/\//.test(str(c.source_url)))continue;
      const ch={scenario:nm,what_changed:str(c.what_changed).slice(0,300),source_url:str(c.source_url),date:dkey()};
      S.libChanged=Object.assign({},S.libChanged,{[SOPE.lc(nm)]:ch});W.changed.push(ch);
      await ensureFamily(nm);for(const k of [...DB.keys])if(SOPE.famOfKey(k)===SOPE.lc(nm)&&/^[^|]+\|(core|errors|practice|prereq|uat|verify|stepmap)\|/.test(k))await DB.del(k);
    }
  }catch(e){W.error=errMsg(e).slice(0,160);if(e.rate||e.fatal){S.weekly=Object.assign({},S.weekly,{tried:dkey()});save();throw e}}
  S.weekly=W;save();return W;
}

const ROUNDS=['OTC consultant: technical and configuration','OTC consultant: scenario and case study','Lead / solution architect','Executive / VP panel','Functional deep-dive','Leadership and behavioral','Company-specific','Screening call'];
async function doInterview(){
  const q=clean(U.m.iQ),round=U.m.iRound||ROUNDS[0],co=clean(U.m.iCo);
  if(!q&&!co)return toast('Type a topic or a company first',true);
  const title=`${round}: ${q||'general SAP'}${co?' @ '+co:''}`;
  let it=findLib('interview',title);
  if(!it)await run('Writing the interview…',async()=>{
    const d=await aj(`Write a realistic ${round} job interview for a ${S.set.role} role${co?' at the company "'+co+'" (use what is publicly known about the company and its SAP programs)':''}, focused on: ${q||'general SAP leadership and Order-to-Cash'}. ${S.set.research?'Use Google Search so the SAP content and company facts are current. ':''}Two speakers: the interviewer asks, probes and follows up; the candidate gives strong, structured answers in first person that start simple and show real SAP depth plus executive thinking (value, risk, people, governance). Return ONLY JSON: {"turns":[{"who":"interviewer|candidate","text":""}],"takeaways":["what made the answers strong"],"watch_out":["mistakes to avoid"]}. 16-20 turns, starting with the interviewer. Candidate answers 3-6 sentences each.`,{search:!!S.set.research,temp:0.7});
    const turns=arr(d.turns).filter(t=>t&&t.text).map(t=>({who:/cand/i.test(str(t.who))?'candidate':'interviewer',text:str(t.text)}));
    if(turns.length<4)throw new Error('BADJSON');
    it={id:uid(),kind:'interview',title,created:dkey(),data:{turns,takeaways:arr(d.takeaways),watch_out:arr(d.watch_out),topic:q,co,round},src:LASTSRC.slice()};S.lib.unshift(it);save();
  });
  if(it){U.open.interview=it.id;U.iv=null;U.tab='interview';render()}
}
async function ivStart(it){
  await run('Preparing your questions…',async()=>{
    const d=await aj(`Give 8 interview questions for a ${it.data.round} interview for a ${S.set.role} role${it.data.co?' at '+it.data.co:''}, focus: ${it.data.topic||'SAP leadership'}. Mix: simple openers, functional depth, production problem scenarios, executive judgment. Return ONLY JSON: {"questions":[""]}`,{nocache:true,temp:0.8});
    const qs=arr(d.questions).map(str).filter(Boolean);if(!qs.length)throw new Error('BADJSON');
    U.iv={qs,i:0,fb:null,score:[]};U.m.ivAns='';

}
async function ivCheck(){
  const ans=clean(U.m.ivAns);if(ans.length<10)return toast('Answer first (speak or type a few sentences)',true);
  const V=U.iv;
  await run('Your coach is reviewing the answer…',async()=>{
    V.fb=await aj(`Interview question: "${V.qs[V.i]}". The candidate (aiming for ${S.set.role}) answered: """${ans.slice(0,4000)}""". Coach them kindly and simply. Return ONLY JSON: {"score":7,"good":["what was good"],"missing":["what was missing or wrong, explained simply"],"model_answer":"a strong first-person answer, 4-7 sentences","exec_tip":"one tip to sound more executive"}. Score 0-10.`,{nocache:true,temp:0.3});
    V.score.push(Number(V.fb.score)||0);
  });
}
function interviewHtml(it){
  const d=it.data,items=d.turns.map(t=>({text:t.text,role:t.who==='candidate'?'b':'a'}));

  if(V){const f=V.fb;
    h+=`<div class="card"><h3>🎤 Question ${V.i+1} of ${V.qs.length}</h3><p style="font-size:20px">${esc(V.qs[V.i])} ${say(V.qs[V.i],'Interviewer')}</p>
    <textarea data-m="ivAns" placeholder="Speak with the microphone or type your answer…">${M('ivAns')}</textarea>
    <button class="btn alt" data-a="ivMic">${U.listening?'🔴 Listening…':'🎤 Speak'}</button><button class="btn" data-a="ivCheck">Get feedback</button>${V.i<V.qs.length-1?`<button class="btn alt" data-a="ivNext">Next question ➡️</button>`:`<button class="btn alt" data-a="ivEnd">Finish</button>`}
    ${f?`<div class="fb ${Number(f.score)>=7?'ok':'info'}"><b>Score: ${esc(str(f.score))}/10</b>${arr(f.good).length?`<br><b>Good:</b>${li(f.good)}`:''}${arr(f.missing).length?`<b>Missing:</b>${li(f.missing)}`:''}<b>Model answer:</b> ${esc(str(f.model_answer))} ${say(str(f.model_answer),'Model answer')}${f.exec_tip?`<br>💼 <b>Executive tip:</b> ${esc(str(f.exec_tip))}`:''}</div>`:''}</div>`}
  h+=`<div class="card"><h3>Transcript</h3>${d.turns.map(t=>`<div class="turn ${t.who==='candidate'?'b':'a'}"><b>${t.who==='candidate'?'🙋 Candidate':'🧑‍💼 Interviewer'}</b><br>${esc(t.text)}</div>`).join('')}</div>
  ${sec('✅ What made the answers strong',li(d.takeaways))}${sec('⚠️ Watch out',li(d.watch_out))}`;
  return h;
}

views.mentor=()=>`<div class="card"><h2>🧑‍🏫 Mentor</h2><div class="chat" id="chat">${S.chat.length?S.chat.map(m=>`<div class="msg ${m.r}">${esc(m.t)}${m.r==='m'?' '+say(m.t,'Mentor')+` <button class="btn sm alt" data-a="noteSave" data-k="chat" data-i="${S.chat.indexOf(m)}">📌</button>`:''}${arr(m.src).length?`<div class="mut">🔎 ${arr(m.src).map(x=>link(x.uri,x.title||'source')).join(' · ')}</div>`:''}</div>`).join(''):'<p class="mut">Ask anything: "what is a pricing procedure?", "how do I answer why S/4HANA?", "explain ATP like I am five". I explain simply first, then go deeper.</p>'}${U.load?'<div class="msg m">…</div>':''}</div>
  <div class="row"><textarea data-m="chatIn" style="min-height:64px" placeholder="Type your question…">${M('chatIn')}</textarea><button class="btn" data-a="send">Send ➤</button><button class="btn alt" data-a="mic">${U.listening?'🔴':'🎤'}</button></div><div><button class="btn alt" data-a="mentorNext">📍 Teach me the next topic</button><button class="btn alt" data-a="mentorQuiz">📝 Quiz me</button><button class="btn alt" data-a="mentorWhy">🤔 Why does this matter in an interview?</button></div><button class="btn sm alt" data-a="chatClear">🧹 Clear chat</button></div>`;
async function sendChat(){
  const t=clean(U.m.chatIn);if(!t)return;U.m.chatIn='';S.chat.push({r:'u',t});S.chat=S.chat.slice(-60);save();
  await run('Mentor is thinking…',async()=>{
    const hist=S.chat.slice(-12).map(m=>({role:m.r==='u'?'user':'model',text:m.t}));while(hist.length&&hist[0].role!=='user')hist.shift();
    const reply=await at('',{contents:hist,temp:0.6,search:!!S.set.research,sys:`Learner progress on the OTC roadmap: ${allTopics().filter(isDone).length} of ${allTopics().length} core topics done; most recent done: ${allTopics().filter(isDone).slice(-3).join('; ')||'none yet'}; next planned: ${nextTopic()||'finished'}. `+'You are chatting as the mentor. Answer in under 170 words: first the simple explanation with an analogy, then the real SAP detail (tcode/app/config), then how to say it in an executive interview. End with one question that checks understanding or one next step.'});
    S.chat.push({r:'m',t:reply,src:LASTSRC.slice(0,4)});S.chat=S.chat.slice(-60);save();
  });
}

. 'Create sales document type ZOR1 by copying OR'), associate-level scope but strict, solvable in a live SAP S/4HANA Cloud Private Edition / on-premise system in the time box. Then write the hidden REFERENCE SOLUTION and the CHECKS an evaluation script would run. Only use transactions, IMG paths, Fiori apps and fields you are sure exist; prefer the standard IMG path. Return ONLY a JSON object: {\"title\": short task title, \"business_context\": 2-3 sentences, \"subtasks\": array of 2-4 strings (each one clear instruction with the exact names and values to use), \"expected_outcome\": 1-2 sentences describing what must be true in the system, \"time_box_minutes\": 15-40, \"reference_solution\": array of 4-10 objects {step: what to do, where: transaction code and/or SPRO/IMG path or Fiori app, values: the exact objects / fields / values to set}, \"checks\": array of 3-6 objects {id: 'C1'...'C6', check: what the evaluation script verifies in the system, e.g. 'Item category ZTAN is assigned to sales document type ZOR1 with item category group NORM'}, \"hint\": one sentence pointing to where to start without giving the answer}.", "certGrade": "You are the evaluation script of an SAP practical certification exam AND a first-class coach. The learner cannot use a live system here, so they describe the steps they would perform. Score STRICTLY like the exam's evaluation scripts: a check passes only if the described steps would really produce that system state -- right object, right place (transaction / IMG node), right value. Vague or partial descriptions fail the check; a different but valid route to the same system state passes. Then coach them so they learn fast. Speak to them as 'you', direct and kind. Return ONLY a JSON object: {\"checks\": array of {id, passed: true/false, why: one sentence}, \"verdict\": one sentence, \"right\": array of 0-4 short strings (what you got right), \"wrong\": array of 0-5 short strings, each 'what you wrote or missed -> what is correct'), \"correct_solution\": array of ordered objects {step, where, values} (the full correct way, refined from the reference), \"why\": 2-4 sentences on why this works in SAP (the underlying logic, e.g. how determination finds the value), \"exam_tip\": 2-3 sentences on how to approach this kind of task in the real open-book exam (where to look in SAP Help or the IMG, how to verify the system output before moving on, time management), \"remember\": one short memory hook}."};
const labelOf=k=>cap(String(k).replace(/_/g,' '));
const isFlat=o=>o&&typeof o==='object'&&!Array.isArray(o)&&Object.values(o).every(v=>v==null||typeof v!=='object');
/* generic renderer for researched JSON: strings, lists, tables, click-by-click steps */
function gen(v,depth){
  depth=depth||0;
  if(v==null||v==='')return '';
  if(typeof v!=='object')return `<p>${esc(String(v))}</p>`;
  if(Array.isArray(v)){
    if(!v.length)return '';
    if(v.every(x=>typeof x!=='object'))return `<ul>${v.map(x=>`<li>${esc(String(x))}</li>`).join('')}</ul>`;
    const objs=v.filter(x=>x&&typeof x==='object'&&!Array.isArray(x));
    if(objs.length&&objs.every(o=>o.step&&(Array.isArray(o.actions)||Array.isArray(o.fields))))return objs.map((o,i)=>stepHtml({phase:str(o.phase),step:str(o.step),where:str(o.where||o.transaction||''),fiori:str(o.fiori||''),screen_title:str(o.screen_title||''),values:str(o.values||o.result||''),actions:arr(o.actions).map(str),fields:arr(o.fields).filter(f=>f&&typeof f==='object').map(f=>({field:str(f.field),value:str(f.value),note:str(f.note||'')})),check:str(o.check||''),why:str(o.why||o.explanation||''),if_missing:str(o.if_missing||''),verify_note:str(o.verify_note||''),skip_if:'',sap_refs:[]},i)).join('');
    if(objs.length&&objs.every(isFlat)){const keys=[...new Set(objs.flatMap(o=>Object.keys(o)))].slice(0,7);return tbl(keys.map(labelOf),objs.map(o=>keys.map(k=>esc(str(o[k])))))}
    return objs.map((o,i)=>{const ks=Object.keys(o),head=str(o[ks[0]]);return `<details ${i===0&&depth===0?'open':''}><summary>${esc(head.slice(0,140))}</summary>${ks.slice(1).map(k=>`<div><b>${esc(labelOf(k))}</b>${gen(o[k],depth+1)}</div>`).join('')}</details>`}).join('');
  }
  return Object.keys(v).map(k=>`<div><b>${esc(labelOf(k))}</b>${gen(v[k],depth+1)}</div>`).join('');
}
const flatText=v=>v==null?'':typeof v!=='object'?String(v):Array.isArray(v)?v.map(flatText).join('. '):Object.values(v).map(flatText).join('. ');

function weakAdd(q,options,correct,why,topic){S.weak=arr(S.weak);const k=norm(q).slice(0,80);if(S.weak.some(w=>norm(w.q).slice(0,80)===k))return;S.weak.unshift({id:uid(),q:str(q),options:arr(options).map(str),correct:arr(correct).map(Number),why:str(why),topic:str(topic)});S.weak=S.weak.slice(0,120);save()}
function mcq(key,q,options,correct,why,topic){
  const s=U.quiz[key],cor=arr(correct).map(Number);
  return `<p><b>${esc(str(q))}</b></p>${arr(options).map((o,i)=>`<button class="opt ${s==null?'':(cor.includes(i)?'ok':(i===s?'no':''))}" data-a="mcq" data-k="${esc(key)}" data-i="${i}" ${s!=null?'disabled':''}>${esc(str(o))}</button>`).join('')}${s!=null?`<div class="fb ${cor.includes(s)?'ok':'no'}">${cor.includes(s)?'Correct. ':'Not quite. '}${esc(str(why))}</div>`:''}`;
}
const MCQS={};
function drillHtml(){
  const W=arr(S.weak);if(!W.length)return '';
  const D=U.drill,w=D&&W.find(x=>x.id===D.id);
  if(!w)return `<div class="card"><h3>Drill — re-test your weak spots</h3><p class="mut">${W.length} question${W.length>1?'s':''} you got wrong in Practice, lessons and certification quizzes. Get one right and it leaves the list.</p><button class="btn" data-a="drillGo">Start the drill</button></div>`;
  return `<div class="card"><h3>Drill <span class="mut">${W.length} left · ${esc(w.topic)}</span></h3><p style="font-size:17px">${esc(w.q)}</p>${w.options.map((o,i)=>`<button class="opt ${D.sel==null?'':(w.correct.includes(i)?'ok':(i===D.sel?'no':''))}" data-a="drillSel" data-i="${i}" ${D.sel!=null?'disabled':''}>${esc(o)}</button>`).join('')}
  ${D.sel!=null?`<div class="fb ${w.correct.includes(D.sel)?'ok':'no'}">${w.correct.includes(D.sel)?'Correct — removed from your weak spots. ':'Still wrong — it stays on the list. '}${esc(w.why)}</div><button class="btn" data-a="drillGo">Next</button>`:''}<button class="btn alt" data-a="drillStop">Stop</button></div>`;
}

const PERSP=['Either','Implementation project','AMS / support','Pre-sales / advisory'];
function mentorInput(topic,sub,persp,lens,avoid){
  const L=['Teach ONE self-contained lesson for this request.','Category / topic area: '+topic,'Engagement perspective: '+persp];
  if(S.client&&S.client.name)L.push('COMPANY CONTEXT (critical): the candidate is preparing specifically for '+S.client.name+'. Ground this lesson and its examples in how '+S.client.name+' actually operates -- their industry, operating model, channels, scale and known challenges -- so the scenario reads like it came from their business, not a generic example. Where you name their systems or processes, only state as fact what you can verify from sources; otherwise frame it as a typical setup for a business of their type rather than asserting it about them. Keep all SAP substance accurate and release-correct regardless. '+(S.client.ctx||''));
  if(lens)L.push('PRIMARY FOCUS LENS (critical): '+lens+' is the domain this learner specializes in. Whenever this topic is broad or cross-module and could be illustrated with an example from any of several areas, ground every concrete example, transaction code, IDoc/message type, and configuration step specifically in '+lens+' scenarios rather than a generic or unrelated-area example -- for instance, for EDI/IDoc concepts prefer the sales order (ORDERS/ORDERS05), outbound delivery (DESADV/DELVRY07), and invoice (INVOIC/INVOIC02) message types over an unrelated example like the material master (MATMAS). If the topic itself already names a different specific module or domain, stay within that module\'s own scenarios and only bring in '+lens+' where a genuine integration touchpoint naturally belongs.');
  if(sub)L.push('Anchor this lesson tightly on this sub-area of the topic (do not just give a generic overview of the whole broad category): '+sub+'.');
  else if(avoid.length)L.push('The learner already had lessons on these angles of this topic -- pick a DIFFERENT sub-area this time: '+avoid.join('; '));
  L.push('Learner level: '+LEVELS[S.set.level||'scratch']);
  return L.join('\n');
}
async function buildMentorLesson(topic,sub,persp,lens){
  const prev=libOf('lesson').filter(x=>SOPE.lc(x.topic)===SOPE.lc(topic)).map(x=>x.title).slice(0,6);
  const r=await sopCall(P4.mentor,mentorInput(topic,sub,persp||'Either',lens,prev),{search:true,max:14000});
  const d=SOPE.parse(r.text);if(!d.plain_overview&&!d.core_concept_explained)throw new Error('BADJSON');
  const it={id:uid(),kind:'lesson',title:str(d.lesson_title)||topic+(sub?' — '+sub:''),topic,sub:sub||'',created:dkey(),data:d,src:r.src};
  S.lib.unshift(it);save();return it;
}

function pnTranscript(S_){let n=0;return S_.log.map(x=>x.r==='p'?'PANEL ('+x.who+', '+x.kind+'): '+x.text:'ANSWER '+(++n)+(x.assisted?' [ASSISTED]':'')+' ('+x.text.split(/\s+/).length+' words, '+x.secs+' s): '+x.text).join('\n').slice(-14000)}
function pnContext(S_){return 'Topic the panel focuses on: '+(S_.topic||'SAP Order-to-Cash')+'\nRole being assessed: '+S.set.role+(S_.co?'\nCompany: '+S_.co+' -- set scenarios in a business like theirs (plausible, never asserting their real systems).'+(S.client&&S.client.name===S_.co?' '+(S.client.ctx||''):''):'')+'\nCandidate background: '+(S.set.background||'not given')}
async function pnTurn(){
  const P=U.pn,st=PN_STAGES[P.stage];
  const r=await sopCall(P5.turn,pnContext(P)+'\nCURRENT STAGE: '+st[1]+' -- '+st[2]+'\nPanel turns already taken in this stage: '+P.stageTurns+' (after '+(st[0]==='close'?2:4)+' set stage_done true).'+(P.stageTurns===0?'\nThis is the FIRST turn of this stage: open it.':'')+'\nTRANSCRIPT SO FAR:\n'+(pnTranscript(P)||'(nothing yet)')+'\nWrite the json for the next panel turn now.',{max:700});
  const d=SOPE.parse(r.text),who=PN_WHO[str(d.who)]?str(d.who):'Hostile CIO',text=str(d.text).slice(0,600);if(!text)throw new Error('BADJSON');
  const last=P.log.filter(x=>x.r==='u').slice(-1)[0];if(last&&d.note)last.note=str(d.note).slice(0,200);
  P.log.push({r:'p',who,text,kind:str(d.kind)||'followup',stage:st[1]});P.stageTurns++;P.asked=Date.now();P.sug=null;

async function builderTick(){

  if(BG.turn%4!==0)job=await sopTickJob();
