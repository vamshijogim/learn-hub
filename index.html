<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAP Coach</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#1d2433;--mut:#5d6b82;--pri:#4f46e5;--pri2:#e0e7ff;--ok:#16a34a;--okbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2;--line:#d9e0ec;--warn:#fef3c7}
@media (prefers-color-scheme:dark){:root{--bg:#10141d;--card:#1a2030;--ink:#eef1f8;--mut:#9aa7bf;--pri:#818cf8;--pri2:#2a3050;--ok:#4ade80;--okbg:#14301f;--bad:#f87171;--badbg:#3a1a1a;--line:#2c3550;--warn:#3a321a}}
*{box-sizing:border-box}
body{margin:0;font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:110px}
header{background:var(--pri);color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:20px;margin:0}header span{margin-left:auto;font-size:14px}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 16px;max-width:980px;margin:0 auto}
nav button{border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;padding:10px 12px;border-radius:14px;cursor:pointer;text-align:left;line-height:1.3}
nav button b{display:block;font-size:16px}nav button span{color:var(--mut)}
nav button.on{background:var(--pri2);border-color:var(--pri)}
main{max-width:980px;margin:0 auto;padding:4px 16px 30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0}
h2{font-size:22px;margin:4px 0 8px}h3{font-size:18px;margin:4px 0 6px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--pri);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-size:16px;font-weight:600;cursor:pointer;margin:4px 4px 4px 0}
.btn.alt{background:var(--pri2);color:var(--pri)}.btn.bad{background:var(--bad)}.btn.sm{padding:5px 11px;font-size:14px;border-radius:9px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin:4px 0}
textarea{min-height:90px}label{font-size:14px;color:var(--mut);display:block;margin-top:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 160px}.row>.btn{flex:0 0 auto}
.mut{color:var(--mut);font-size:14px}
.tag{display:inline-block;background:var(--pri2);color:var(--pri);border-radius:99px;padding:3px 12px;margin:3px 4px 3px 0;font-size:14px;cursor:pointer;border:0}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;background:var(--warn);margin-right:6px}
.load{background:var(--warn);padding:12px;border-radius:12px;font-weight:600;margin:10px 0}
.bgl{font-size:13px;color:var(--mut);background:var(--okbg);border-radius:10px;padding:8px 12px;margin:10px 0}
.lib{display:inline-block;border:2px solid var(--line);border-radius:10px;padding:4px 10px;margin:3px;font-size:14px;background:var(--card);color:var(--ink);cursor:pointer}.lib.ready{border-color:var(--ok);background:var(--okbg)}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin:6px 0;font-size:16px;color:var(--ink);cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.no{border-color:var(--bad);background:var(--badbg)}
.fb{padding:10px 14px;border-radius:12px;margin:8px 0}.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}.fb.info{background:var(--warn)}
.turn{padding:10px 14px;border-radius:14px;margin:8px 0;max-width:88%}.turn.a{background:var(--pri2)}.turn.b{background:var(--okbg);margin-left:auto}.turn.now{outline:3px solid var(--pri)}
.chat{display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow-y:auto;padding:6px}
.msg{padding:10px 14px;border-radius:16px;max-width:88%;white-space:pre-wrap}.msg.u{align-self:flex-end;background:var(--pri);color:#fff}.msg.m{align-self:flex-start;background:var(--pri2)}
details{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0;background:var(--card)}summary{cursor:pointer;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
ol,ul{padding-left:22px;margin:6px 0}li{margin:4px 0}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--pri);padding:8px 14px;display:none;z-index:50}
#bar .t{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:14px;z-index:99;max-width:90%;display:none}#toast.err{background:#b91c1c}
a{color:var(--pri)}
@media (max-width:640px){nav{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="bar"></div>
<div id="toast"></div>
<script>
'use strict';
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const dkey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const arr=x=>Array.isArray(x)?x:(x==null||x===''?[]:[x]);
const str=x=>x==null?'':(typeof x==='object'?Object.values(x).map(v=>typeof v==='object'?JSON.stringify(v):v).join(' — '):String(x));
const norm=s=>str(s).toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');
const mem={};
const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return k in mem?JSON.parse(mem[k]):d}},
  set(k,v){const s=JSON.stringify(v);try{localStorage.setItem(k,s);return true}catch(e){mem[k]=s;return false}},
  raw(k){try{return localStorage.getItem(k)||''}catch(e){return mem['r'+k]||''}},
  setRaw(k,v){try{localStorage.setItem(k,v)}catch(e){mem['r'+k]=v}},
  del(k){try{localStorage.removeItem(k)}catch(e){delete mem['r'+k]}}
};
function toast(m,err){const t=$('#toast');t.textContent=m;t.className=err?'err':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',err?7000:2600)}
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)+s.length.toString(36)};
const scrub=t=>str(t).replace(/[\w.+-]+@[\w-]+\.[\w.-]+/g,'[email]').replace(/\+?\d[\d\s().-]{8,}\d/g,'[number]');
const clean=t=>scrub(t).trim();

/* ============ state ============ */
const DEF={model:'gemini-3.8-flash',fast:'gemini-3.5-flash-lite',limit:0,research:true,bg:true,bgMax:200,level:'scratch',role:'SAP Order-to-Cash (OTC) consultant',background:'',focus:'Order-to-Cash (SD) and its integrations',rate:1,voiceA:'',voiceB:'',stage:'prep'};
let S=normState(LS.get('sc_state',null));
function normState(s){s=s||{};s.set=Object.assign({},DEF,s.set||{});s.usage=s.usage||{day:'',calls:0,tokens:0,bg:0};s.cache=s.cache||{};if(s.set.role==='Executive / VP-level SAP leader'&&!s.set.level)s.set.role=DEF.role;if(!s.set.bgV){s.set.bgV=1;if(Number(s.set.bgMax)<=40)s.set.bgMax=200}s.prog=s.prog||{};s.queue=Array.isArray(s.queue)?s.queue:[];s.lib=Array.isArray(s.lib)?s.lib:[];s.chat=Array.isArray(s.chat)?s.chat:[];return s}
function save(){if(!LS.set('sc_state',S)){S.cache={};if(!LS.set('sc_state',S))toast('Browser storage is full. Delete old items in Library.',true)}}
const hasKey=()=>!!LS.raw('sc_key');
let LASTSRC=[];

/* ============ Gemini ============ */
const LEVELS={scratch:'LEVEL: complete beginner. Teach from zero in very small steps, one idea at a time, always starting with the business story before any SAP screen or configuration, and check understanding often.',consultant:'LEVEL: junior to mid OTC consultant. Go to hands-on depth: configuration paths, tcodes, Fiori apps, tables, issue analysis, and consultant-style interview questions.',lead:'LEVEL: senior/lead consultant. Focus on solution design, integration trade-offs, global template decisions, risk, and lead/architect interview questions.',vp:'LEVEL: executive. Focus on business value, transformation, governance, KPIs, vendor management, and VP-level interview questions; keep technical detail brief but accurate.'};
const sysPrompt=()=>`${LEVELS[S.set.level||'scratch']} You are SAP Coach: a patient senior SAP mentor and executive interview coach. The learner knows NOTHING about SAP or configuration. Teach like they are five years old first: plain words, everyday analogies, define every term and acronym the first time. Then go deeper, down to real configuration detail. ${S.set.stage==='role'?`The learner NOW HOLDS the role of ${S.set.role}. Help them perform it: decisions to make, governance, steering committees, budgets, vendor and system-integrator management, risks, KPIs, and the questions to ask their teams and partners (with what a good answer sounds like). Where a format asks for interview questions, give the questions a leader in this role gets asked by the board, peers, auditors and teams, plus questions to ask their own team.`:`Prepare them for ${S.set.role} interviews: business outcomes, risk, controls, program delivery and stakeholder language, in addition to hands-on detail.`} Accuracy rules: use real transaction codes, Fiori app names/IDs, SPRO/IMG paths, tables and SAP Note numbers only when you are confident; otherwise say "verify on help.sap.com". Prefer SAP S/4HANA (latest releases; mention Cloud Public Edition vs Private Edition/on-premise differences) and say which release introduced a feature when known. Never invent facts about a company; say what is publicly known and mark guesses as assumptions. Plain text only, no markdown, no LaTeX. Learner profile: target role: ${S.set.role}; background: ${S.set.background||'not given'}; focus area: ${S.set.focus||'general SAP'}. Today is ${dkey()}.${S.set.research?' '+ORDER:''}`;
const ORDER='When you search, check sources in this order and prefer the earlier ones when they disagree: (1) official SAP documentation on help.sap.com, including product documentation, What\'s New / release notes and the Feature Scope Description; (2) the official SAP website: sap.com, SAP Learning, SAP Roadmap Explorer, SAP Best Practices / Signavio Process Navigator, SAP Fiori Apps Reference Library; (3) SAP Notes and Knowledge Base Articles (me.sap.com, support.sap.com, userapps.support.sap.com) for standard, SAP-recommended workarounds; (4) SAP Community (community.sap.com) blogs and question threads for real-world discussions and workarounds; (5) SAP Joule: what the Joule copilot can do for this topic and in which products/releases; (6) training videos and courses: YouTube (SAP official channels first, then reputable trainers) and the public pages of Udemy courses (use their titles, descriptions and curriculum outlines; you cannot watch paid content); (7) public GitHub repositories (SAP-samples, SAP-docs, SAP-archive, and community study repos; treat community repos as unverified, and mention their licence when you cite code); (8) any other publicly available documentation (partner blogs, analyst and consulting articles). Say which kind of source a key fact comes from when it matters.';
const RETRY_MS=()=>window.__fcFast?5:900;
function errMsg(e){
  const m=String(e&&e.message||e);
  if(m==='NOKEY')return '🔑 Paste your Gemini key in Settings first.';
  if(m==='LIMIT')return '⏸️ Daily AI limit reached (change it in Settings).';
  if(/^HTTP 400/.test(m)&&/key/i.test(m))return '🔑 Google says the key is not valid. Check Settings.';
  if(/^HTTP (401|403)/.test(m))return '🔑 Key rejected, or the Gemini API is not enabled for it.';
  if(/^HTTP 404/.test(m))return '🤖 Model name not found. Fix the model names in Settings (see ai.google.dev/gemini-api/docs/models).';
  if(/^HTTP 429/.test(m))return '🐢 Google rate limit hit. Wait a minute and try again.';
  if(m==='BADJSON')return '😕 The AI answer was garbled. Please try again.';
  if(/Failed to fetch|NetworkError|TypeError/i.test(m))return '📡 Cannot reach Google. Check the internet connection.';
  return '⚠️ '+m.slice(0,200);
}
async function callGemini(body,model,fb){
  const key=LS.raw('sc_key');if(!key)throw new Error('NOKEY');
  const day=dkey();if(S.usage.day!==day)S.usage={day,calls:0,tokens:0,bg:0};
  if(Number(S.set.limit)>0&&S.usage.calls>=Number(S.set.limit))throw new Error('LIMIT');
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
  let last;
  for(let i=0;i<3;i++){
    try{
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});
      if(r.ok){
        const j=await r.json();
        S.usage.calls++;S.usage.tokens+=j.usageMetadata?.totalTokenCount||0;save();
        LASTSRC=(j.candidates?.[0]?.groundingMetadata?.groundingChunks||[]).map(c=>c.web).filter(Boolean).slice(0,6);
        const text=(j.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('').trim();
        if(!text)throw new Error('The AI gave no answer ('+(j.promptFeedback?.blockReason||j.candidates?.[0]?.finishReason||'empty')+'). Try again.');
        return text;
      }
      let msg='';try{msg=(await r.json()).error?.message||''}catch(e){}
      last=new Error('HTTP '+r.status+' '+msg);
      if(![429,500,502,503,504].includes(r.status))throw last;
    }catch(e){
      if(e===last&&!/^HTTP (429|5)/.test(e.message))throw e;
      if(/^The AI gave no/.test(e.message))throw e;
      last=e;
    }
    if(i<2)await new Promise(r=>setTimeout(r,RETRY_MS()*Math.pow(2,i)));
  }
  if(/^HTTP 429/.test(String(last&&last.message))&&model!==S.set.fast&&!fb)return callGemini(body,S.set.fast,true);
  throw last;
}
function buildBody(prompt,o){
  const contents=o.contents?o.contents.map(c=>({role:c.role,parts:[{text:scrub(c.text)}]})):[{role:'user',parts:[{text:scrub(prompt)}]}];
  const body={systemInstruction:{parts:[{text:sysPrompt()+(o.sys?' '+o.sys:'')}]},contents,generationConfig:{temperature:o.temp??0.5}};
  if(o.search)body.tools=[{google_search:{}}];else if(o.json)body.generationConfig.responseMimeType='application/json';
  return body;
}
function parseJSON(t){
  t=str(t).replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim();
  try{return JSON.parse(t)}catch(e){}
  const a=t.search(/[\[{]/);if(a<0)throw new Error('BADJSON');
  const b=t.lastIndexOf(t[a]==='{'?'}':']');
  try{return JSON.parse(t.slice(a,b+1))}catch(e){throw new Error('BADJSON')}
}
async function aj(prompt,o={}){
  const model=o.fast?S.set.fast:S.set.model;
  const body=buildBody(prompt,Object.assign({json:true},o));
  const ck=o.nocache?null:hash(model+JSON.stringify(body).replace(/Today is \d{4}-\d\d-\d\d/,''));
  if(ck&&S.cache[ck]&&Date.now()-S.cache[ck].t<(o.search?7:30)*864e5){try{LASTSRC=S.cache[ck].s||[];return parseJSON(S.cache[ck].v)}catch(e){}}
  let text,obj;
  for(let k=0;k<2;k++){text=await callGemini(body,model);try{obj=parseJSON(text);break}catch(e){if(k)throw e}}
  if(ck){S.cache[ck]={t:Date.now(),v:text,s:LASTSRC};const ks=Object.keys(S.cache);if(ks.length>60)ks.sort((a,b)=>S.cache[a].t-S.cache[b].t).slice(0,ks.length-40).forEach(k=>delete S.cache[k]);save()}
  return obj;
}
const at=(prompt,o={})=>callGemini(buildBody(prompt,o),o.fast?S.set.fast:S.set.model);

/* ============ voice player (two voices) ============ */
const PL={q:[],i:0,on:false,title:'',cur:null,lock:null};
const enVoices=()=>{try{return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}catch(e){return []}};
function pickVoice(role){const v=enVoices();if(!v.length)return null;const a=v.find(x=>x.name===S.set.voiceA)||v[0];const b=v.find(x=>x.name===S.set.voiceB)||v.find(x=>x!==a&&x.name.split(' ')[1]!==a.name.split(' ')[1])||v.find(x=>x!==a)||a;return role==='b'?b:a}
function chunks(t){const out=[];str(t).split(/(?<=[.!?;:])\s+/).forEach(s=>{while(s.length>220){let k=s.lastIndexOf(' ',220);if(k<80)k=220;out.push(s.slice(0,k));s=s.slice(k)}if(s.trim())out.push(s.trim())});return out}
function play(items,title){
  if(!window.speechSynthesis)return toast('Voice is not supported in this browser',true);
  speechSynthesis.cancel();PL.q=[];arr(items).forEach((it,n)=>chunks(it.text).forEach(c=>PL.q.push({t:c,r:it.role||'a',n})));
  if(!PL.q.length)return;PL.i=0;PL.on=true;PL.title=title||'Listening';
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>PL.lock=l).catch(()=>{})}catch(e){}
  speakNext();
}
function speakNext(){
  if(!PL.on)return bar();
  if(PL.i>=PL.q.length){PL.on=false;PL.i=0;try{PL.lock&&PL.lock.release()}catch(e){}return bar()}
  const c=PL.q[PL.i],u=new SpeechSynthesisUtterance(c.t),v=pickVoice(c.r);
  if(v){u.voice=v;u.lang=v.lang}else u.lang='en-US';
  u.rate=Number(S.set.rate)||1;u.pitch=c.r==='b'?1.2:0.9;
  u.onend=u.onerror=()=>{if(PL.cur!==u)return;PL.i++;speakNext()};
  PL.cur=u;speechSynthesis.speak(u);bar();
  document.querySelectorAll('.turn').forEach((e,i)=>e.classList.toggle('now',PL.on&&i===c.n&&U.tab==='interview'));
}
function plStop(){PL.on=false;PL.cur=null;try{speechSynthesis.cancel()}catch(e){}bar()}
function bar(){
  const b=$('#bar');if(!PL.q.length){b.style.display='none';return}
  b.style.display='block';
  b.innerHTML=`<div class="t">🎧 ${esc(PL.title)} · ${Math.min(PL.i+1,PL.q.length)}/${PL.q.length}</div>
  <button class="btn sm alt" data-a="plBack">⏮ Back</button><button class="btn sm" data-a="plToggle">${PL.on?'⏸ Pause':'▶ Play'}</button><button class="btn sm alt" data-a="plFwd">Skip ⏭</button><button class="btn sm alt" data-a="plClose">✖ Close</button>
  <select data-rate style="width:auto;display:inline-block;padding:4px 8px">${[0.8,1,1.2,1.5].map(r=>`<option value="${r}" ${Number(S.set.rate)===r?'selected':''}>${r}x</option>`).join('')}</select>`;
}
function listen(cb){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('Microphone input is not supported here. Use Chrome or Edge, or type.',true);return}
  plStop();const r=new SR();r.lang='en-US';r.interimResults=false;r.continuous=false;
  r.onresult=e=>cb(e.results[0][0].transcript);r.onerror=e=>toast('Microphone: '+e.error,true);r.onend=()=>{U.listening=false;render()};
  try{r.start();U.listening=true;render()}catch(e){toast('Could not start the microphone',true)}
}

/* ============ UI state + helpers ============ */
const U={sopStg:{},stg:{},tab:'roadmap',m:{},load:null,open:{},listening:false,iv:null,quiz:{}};
async function run(label,fn){if(U.load)return toast('Still working on the last request…');U.load=label;render();try{await fn()}catch(e){toast(errMsg(e),true)}finally{U.load=null;render()}}
const M=k=>esc(U.m[k]||'');
const inp=(k,ph,en)=>`<input data-m="${k}" value="${M(k)}" placeholder="${esc(ph||'')}" ${en?`data-en="${en}"`:''}>`;
const sel=(k,opts,dflt)=>`<select data-m="${k}">${opts.map(o=>{const v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return `<option value="${esc(v)}" ${(U.m[k]??dflt)===v?'selected':''}>${esc(l)}</option>`}).join('')}</select>`;
const link=(u,t)=>/^https?:\/\//i.test(str(u))?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(t||u)}</a>`:esc(t||'');
const li=(a,ord)=>arr(a).length?`<${ord?'ol':'ul'}>${arr(a).map(x=>`<li>${esc(str(x))}</li>`).join('')}</${ord?'ol':'ul'}>`:'';
const SPK={};let spkN=0;
function say(text,title){const id='s'+(++spkN);SPK[id]={text,title};return `<button class="btn sm alt" data-a="say" data-id="${id}" title="Listen">🔊 Listen</button>`}
const sec=(title,html,speech)=>html?`<div class="card"><h3>${title} ${speech?say(speech,title.replace(/^\S+\s/,'')):''}</h3>${html}</div>`:'';
const TR=[[/help\.sap\.com/i,1,'Official docs'],[/(^|[./ ])(me|support|userapps\.support|launchpad\.support)\.sap\.com/i,3,'SAP Notes/KBA'],[/community\.sap\.com|blogs\.sap\.com|answers\.sap\.com/i,4,'SAP Community'],[/(^|[./ ])sap\.com/i,2,'SAP website'],[/youtube\.com|youtu\.be|udemy\.com/i,6,'Video/course'],[/github\.com/i,7,'GitHub (community)']];
const tierOf=x=>{const t=str(x.title)+' '+str(x.uri);const m=TR.find(r=>r[0].test(t));return m?[m[1],m[2]]:[9,'Other public']};
const srcHtml=s=>arr(s).length?`<div class="mut">🔎 Pages searched (official first): ${arr(s).map(x=>({x,t:tierOf(x)})).sort((a,b)=>a.t[0]-b.t[0]).map(o=>`<span class="pill">${o.t[1]}</span>${link(o.x.uri,o.x.title||'source')}`).join(' · ')}</div>`:'';
const libOf=k=>S.lib.filter(x=>x.kind===k);
const findLib=(k,title)=>S.lib.find(x=>x.kind===k&&norm(x.title)===norm(title));
function getOpen(k){return S.lib.find(x=>x.id===U.open[k]&&x.kind===k)}
function recent(k,act){const l=libOf(k).slice(0,12);return l.length?`<div class="mut" style="margin-top:6px">Saved:</div>${l.map(x=>`<button class="lib ready" data-a="${act}" data-id="${x.id}">${esc(x.title)}</button>`).join('')}`:''}


var views=views||{};

async function pullShared(){
  try{
    const r=await fetch('library/index.json?'+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const j=await r.json();SH.idx={};arr(j.items).forEach(x=>{if(x&&x.title&&x.file)SH.idx[norm(x.title)]=x});
    let n=0;
    for(const x of arr(j.items)){
      if(!x||!x.title||!x.file||n>=200)continue;
      const it=findLib('sop',x.title);
      if(it&&(!it.sharedBuilt||it.sharedBuilt>=x.built))continue;
      const f=await fetch('library/'+x.file+'?'+encodeURIComponent(x.built||''),{cache:'no-store'});if(!f.ok)continue;
      const d=await f.json();if(!arr(d.data&&d.data.steps).length)continue;
      if(it){it.data=d.data;it.src=arr(d.src);it.sharedBuilt=x.built}else S.lib.unshift({id:uid(),kind:'sop',title:x.title,created:x.built,data:d.data,src:arr(d.src),sharedBuilt:x.built});
      n++;
    }

  }catch(e){}finally{SH.done=true}
}

  const head=`Research ${what}. ${S.set.research?'Use Google Search for the latest information (SAP Help, SAP Community, SAP release notes, news). ':''}Return ONLY JSON, no other text: `;
  if(part==='a')return head+`{"eli5":"explain it to a five-year-old in 6-9 sentences with an everyday analogy","context":"for a company or industry: what they do, what is publicly known about their SAP landscape and programs, and why it matters; for a topic: where it sits in SAP","scenario":"a concrete business scenario told as a short story","where_used":["industries, company types or situations where it is used"],"process_flow":["step in order, who does it"],"modules":["module or component — its role here"],"key_terms":[{"term":"","meaning":"simple meaning"}],"s4_look":[{"app":"Fiori app or transaction name","id":"Fiori app ID or tcode","what_you_see":"what the screen shows and what the user does"}],"related":["6 related topics to study next"]}`;
  if(part==='b')return head+`{"prerequisites":["what must exist first"],"config_steps":[{"step":"","where":"SPRO/IMG path, tcode or Fiori config app","what":"what you set and why, in simple words","example":"example value"}],"master_data":["master data needed and where it is maintained"],"implementation":{"approach":"how to implement it in an S/4HANA environment","phases":[{"phase":"","activities":[""]}],"testing":["key test scenarios"],"risks":["risk and mitigation"]},"versions":[{"release":"S/4HANA release or year","what":"what is available or changed"}],"whats_new":["newest changes in the latest releases, with release names"],"cloud_vs_onprem":"differences between Cloud Public Edition and Private Edition/on-premise"}. Give 8-14 config steps in the real order.`;
  if(part==='v')return `Use Google Search to find the best learning videos and courses for ${what}, especially ones that walk through the configuration on a real S/4HANA system. Return ONLY JSON, no other text: {"youtube":[{"title":"","url":"https://www.youtube.com/watch?v=...","channel":"","covers":"what it shows, extracted from its title, description and transcript if available","best_for":"which configuration step or section it helps with"}],"udemy":[{"title":"","url":"https://www.udemy.com/course/...","level":"","covers":"summary of the public curriculum: the sections and what you learn"}],"watch_order":["what to watch first, second, third and why"]}. 4-6 real YouTube videos (SAP official channels first) and 2-4 real Udemy courses. Only include items you actually found; never invent a URL.`;
  return head+`{"issues":[{"issue":"common production issue","symptom":"error message/number or what the user sees","cause":"","fix":"step-by-step fix","prevent":""}],"interview":[{"level":"basic|functional|executive","q":"","answer":"strong model answer in first person, 3-6 sentences","tip":"what the interviewer is really checking"}],"exec_points":["talking point a VP would make: value, risk, cost, governance"],"numbers":["KPI or metric to know"],"workarounds":[{"problem":"","workaround":"the standard or community-proven workaround","source":"SAP Note/KBA number, help.sap.com page or community thread title"}],"joule":["what SAP Joule can do for this topic today, and in which product/release (say if nothing is available yet)"],"references":[{"tier":"1 official documentation|2 SAP website|3 SAP Note/KBA|4 SAP Community|5 Joule|6 video or course|7 GitHub or other public","title":"","url":"","what":"what it covers"}],"story":"a STAR-format story template the learner can adapt"}. Give 6-8 issues, 12 interview questions (4 basic, 4 functional, 4 executive/VP level), 3-6 workarounds, and 6-12 references sorted by tier 1 to 6 (only real pages you found; leave url empty if unsure).`;
}
const PARTS=['a','b','c','v'];

async function buildSop(q){

/* ============ background builder ============ */
const BG={busy:false,now:'',last:'',note:''};
const BG_MS=window.__fcBgMs||30000;
async function builderTick(){
  if(BG.busy||!S.set.bg||!hasKey()||U.load)return;
  const day=dkey();if(S.usage.day!==day)S.usage={day,calls:0,tokens:0,bg:0};
  if((S.usage.bg||0)>=Number(S.set.bgMax)){BG.note='daily background budget used';return}
  if(!SH.done&&Date.now()-T0<20000)return;
  seedQueue();
  let job=null;
  for(const c of libOf('course')){const i=c.data.lessons.findIndex(l=>!l.body&&(l.tries||0)<3);if(i>=0){job={label:`${c.title} — lesson ${i+1}`,fn:()=>buildLesson(c,i),fail:()=>{c.data.lessons[i].tries=(c.data.lessons[i].tries||0)+1}};break}}
  if(!job)for(const p of libOf('pack')){const part=PARTS.find(x=>!p.data[x]);if(part&&(p.tries||0)<3){job={label:`${p.title} — research`,fn:async()=>{p.data[part]=await aj(packPrompt(part,p.title,p.sub),{search:!!S.set.research});p.built=dkey()},fail:()=>{p.tries=(p.tries||0)+1}};break}}
  if(!job){const q=S.queue.find(x=>(x.tries||0)<3);if(q)job={label:`${q.title} (SOP)`,fn:async()=>{await buildSop(q.title);S.queue=S.queue.filter(x=>x!==q)},fail:()=>{q.tries=(q.tries||0)+1;q.day=dkey()}}}
  if(!job&&S.set.research){const old=libOf('pack').find(p=>p.built&&(Date.now()-new Date(p.built+'T12:00:00').getTime())>30*864e5&&PARTS.every(x=>p.data[x]));
    if(old)job={label:`${old.title} — monthly refresh for the latest information`,fn:async()=>{for(const part of PARTS){const keep=part==='v'&&old.data.v;const d=await aj(packPrompt(part,old.title,old.sub),{search:true,nocache:true});old.data[part]=d;S.usage.bg=(S.usage.bg||0)+1}old.built=dkey();old.refreshed=dkey()},fail:()=>{old.built=dkey()}}}
  if(!job){BG.note='';return}
  BG.busy=true;BG.now=job.label;BG.note='';softRender();
  try{await job.fn();BG.last=job.label}catch(e){job.fail();BG.note=errMsg(e)}
  S.usage.bg=(S.usage.bg||0)+1;BG.busy=false;BG.now='';save();softRender();
}

  chatClear:()=>{if(confirm('Clear the chat?')){S.chat=[];save();render()}},
  say:d=>{const s=SPK[d.id];if(s)play(s.items||[{text:s.text}],s.title)},
  plToggle:()=>{if(PL.on){PL.on=false;PL.cur=null;speechSynthesis.cancel();bar()}else{PL.on=true;if(PL.i>=PL.q.length)PL.i=0;speakNext()}},
  plBack:()=>{PL.i=Math.max(0,PL.i-2);PL.cur=null;speechSynthesis.cancel();if(PL.on)speakNext();else bar()},
  plFwd:()=>{PL.i=Math.min(PL.q.length-1,PL.i+1);PL.cur=null;speechSynthesis.cancel();if(PL.on)speakNext();else bar()},
  plClose:()=>{plStop();PL.q=[];bar()},
  del:d=>{if(!confirm('Delete this item?'))return;S.lib=S.lib.filter(x=>x.id!==d.id);save();render()},
  saveKey:()=>{const k=(U.m.keyIn||'').trim();if(!k)return toast('Paste a key first',true);LS.setRaw('sc_key',k);U.m.keyIn='';toast('Key saved in this browser 🔑');render()},
  delKey:()=>{LS.del('sc_key');toast('Key removed');render()},
  testKey:()=>run('Testing…',async()=>{const t=await at('Reply with the single word OK.',{fast:true});toast('✅ Works: '+t.slice(0,30))}),
  voiceTest:()=>{S.set.voiceA=U.m.sVA??S.set.voiceA;S.set.voiceB=U.m.sVB??S.set.voiceB;play([{text:'Hello, I am your interviewer. Tell me about your SAP experience.',role:'a'},{text:'Thank you. I have led order to cash programs on S four HANA.',role:'b'}],'Voice test')},
  saveSet:()=>{const s=S.set,m=U.m;s.role=(m.sRole??s.role).trim()||DEF.role;s.background=clean(m.sBack??s.background);s.focus=(m.sFocus??s.focus).trim();s.stage=m.sStage??s.stage;s.level=m.sLevel??s.level;s.voiceA=m.sVA??s.voiceA;s.voiceB=m.sVB??s.voiceB;
    if(m.sRes!=null)s.research=m.sRes==='1';if(m.sBg!=null)s.bg=m.sBg==='1';s.bgMax=Math.max(0,parseInt(m.sBgMax??s.bgMax)||0);s.limit=Math.max(0,parseInt(m.sLimit??s.limit)||0);
    s.model=(m.sModel??s.model).trim()||DEF.model;s.fast=(m.sFast??s.fast).trim()||DEF.fast;save();toast('Settings saved ✅');render()},
  backup:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'SAPCoach',v:1,date:new Date().toISOString(),state:Object.assign({},S,{cache:{}})})],{type:'application/json'}));a.download='SAPCoach-backup-'+dkey()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup downloaded 💾 (the key is not included)')}
};
function restoreFile(e){
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=='SAPCoach'||!d.state)throw 0;if(!confirm('Replace everything in this browser with the backup?'))return;S=normState(d.state);save();toast('Restored ✅');render()}catch(x){toast('That is not an SAP Coach backup file',true)}};
  r.readAsText(f);
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(f){const r=f(el.dataset,el);if(r&&r.catch)r.catch(x=>toast(errMsg(x),true))}});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.m;if(k)U.m[k]=e.target.value});
document.addEventListener('change',e=>{const d=e.target.dataset||{};if(d.m)U.m[d.m]=e.target.value;if('rate' in d){S.set.rate=Number(e.target.value);save();if(PL.on){PL.cur=null;speechSynthesis.cancel();speakNext()}}});
document.addEventListener('keydown',e=>{const k=e.target.dataset&&e.target.dataset.en;if(k&&e.key==='Enter'){e.preventDefault();U.m[e.target.dataset.m]=e.target.value;const f=A[k];if(f)f({},e.target)}});
try{speechSynthesis.onvoiceschanged=()=>{if(U.tab==='settings')softRender()}}catch(e){}
window.SC={get S(){return S},U,PL,A};
if(!hasKey())U.tab='settings';
render();bar();
pullShared();setInterval(pullShared,10*60*1000);
setInterval(builderTick,BG_MS);setTimeout(builderTick,Math.min(BG_MS,5000));
</script>
</body>
