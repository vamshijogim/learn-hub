<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study Notes</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#1d2433;--mut:#5d6b82;--pri:#4f46e5;--pri2:#e0e7ff;--ok:#16a34a;--okbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2;--line:#d9e0ec;--warn:#fef3c7}
@media (prefers-color-scheme:dark){:root{--bg:#10141d;--card:#1a2030;--ink:#eef1f8;--mut:#9aa7bf;--pri:#818cf8;--pri2:#2a3050;--ok:#4ade80;--okbg:#14301f;--bad:#f87171;--badbg:#3a1a1a;--line:#2c3550;--warn:#3a321a}}
*{box-sizing:border-box}
body{margin:0;font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:110px}
header{background:var(--pri);color:#fff;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:20px;margin:0}header span{margin-left:auto;font-size:14px}
nav{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:10px 16px 4px;max-width:1100px;margin:0 auto}
nav button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-size:12px;padding:7px 9px;border-radius:14px;cursor:pointer;text-align:left;line-height:1.3}
nav button b{display:block;font-size:14px}nav button span{color:var(--mut)}
nav button.on{background:var(--pri2);border-color:var(--pri)}
main{max-width:1100px;margin:0 auto;padding:4px 16px 30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0}
h2{font-size:22px;margin:4px 0 8px}h3{font-size:18px;margin:4px 0 6px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--pri);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-size:16px;font-weight:600;cursor:pointer;margin:4px 4px 4px 0}
.btn.alt{background:var(--pri2);color:var(--pri)}.btn.bad{background:var(--bad)}.btn.sm{padding:5px 11px;font-size:14px;border-radius:9px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin:4px 0}
textarea{min-height:90px}label{font-size:14px;color:var(--mut);display:block;margin-top:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1 1 160px}.row>.btn{flex:0 0 auto}
.mut{color:var(--mut);font-size:14px}
.tag{display:inline-block;background:var(--pri2);color:var(--pri);border-radius:99px;padding:3px 12px;margin:3px 4px 3px 0;font-size:14px;cursor:pointer;border:0}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;background:var(--warn);margin-right:6px}
.load{background:var(--warn);padding:12px;border-radius:12px;font-weight:600;margin:10px 0}
.bgl{font-size:13px;color:var(--mut);background:var(--okbg);border-radius:10px;padding:8px 12px;margin:10px 0}
.lib{display:inline-block;border:2px solid var(--line);border-radius:10px;padding:4px 10px;margin:3px;font-size:14px;background:var(--card);color:var(--ink);cursor:pointer}.lib.ready{border-color:var(--ok);background:var(--okbg)}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin:6px 0;font-size:16px;color:var(--ink);cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.no{border-color:var(--bad);background:var(--badbg)}
.fb{padding:10px 14px;border-radius:12px;margin:8px 0}.fb.ok{background:var(--okbg)}.fb.no{background:var(--badbg)}.fb.info{background:var(--warn)}
.turn{padding:10px 14px;border-radius:14px;margin:8px 0;max-width:88%}.turn.a{background:var(--pri2)}.turn.b{background:var(--okbg);margin-left:auto}.turn.now{outline:3px solid var(--pri)}
.chat{display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow-y:auto;padding:6px}
.msg{padding:10px 14px;border-radius:16px;max-width:88%;white-space:pre-wrap}.msg.u{align-self:flex-end;background:var(--pri);color:#fff}.msg.m{align-self:flex-start;background:var(--pri2)}
details{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0;background:var(--card)}summary{cursor:pointer;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
ol,ul{padding-left:22px;margin:6px 0}li{margin:4px 0}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px}
.fam{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 10px;text-align:left;cursor:pointer;font-size:13px;line-height:1.3}
.fam b{display:block;font-size:14px}.fam span{color:var(--mut)}.fam.s2{border-color:var(--ok);background:var(--okbg)}.fam.s1{border-color:#d9a400}.fam.on{outline:3px solid var(--pri)}
code{font-family:Consolas,Menlo,monospace;font-size:.9em;background:var(--pri2);padding:1px 5px;border-radius:5px;word-break:break-word}
details.card>summary{font-weight:700}
@media (max-width:640px){.grid4{grid-template-columns:repeat(2,1fr)}}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--pri);padding:8px 14px;display:none;z-index:50}
#bar .t{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:14px;z-index:99;max-width:90%;display:none}#toast.err{background:#b91c1c}
a{color:var(--pri)}
@media (max-width:900px){nav{grid-template-columns:repeat(3,1fr)}}
@media (max-width:640px){nav{grid-template-columns:repeat(2,1fr)}}
.subnav{max-width:1100px;margin:0 auto;padding:0 16px;font-size:13px;color:var(--mut)}.subnav .tag.on{outline:2px solid var(--pri)}
.strip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:14px}.away{background:var(--warn);border-radius:10px;padding:6px 10px;margin-top:6px}
.board p{margin:6px 0}.pill.okp{background:var(--okbg)}.lib.prog{border-color:#d9a400}
.fcard{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 10px;text-align:left;cursor:pointer;font-size:12.5px;line-height:1.35;display:flex;flex-direction:column;gap:3px;min-height:110px}
.fcard b{font-size:13.5px}.fcard span{color:var(--mut)}.fcard .st{color:var(--ink);font-weight:600}.fcard .chg{color:#9a6700}.fcard.s2{border-color:var(--ok);background:var(--okbg)}.fcard.s1{border-color:#a78bfa;background:color-mix(in srgb,var(--pri2) 45%,var(--card))}.fcard.on{outline:3px solid var(--pri)}
h3.stg{color:var(--pri);font-size:15px;margin:14px 0 4px}.weekly{background:color-mix(in srgb,var(--pri2) 35%,var(--card))}

/* ---- clean theme (matches the original Study Notes look) ---- */
:root{--bg:#fff;--card:#fff;--ink:#1f2430;--mut:#6b7280;--pri:#4a3fd0;--pri2:#eeecff;--ok:#1a7f43;--okbg:#eaf7ef;--bad:#c62828;--badbg:#fdecec;--line:#d9dce3;--warn:#fff8e1}
@media (prefers-color-scheme:dark){:root{--bg:#12141a;--card:#181b23;--ink:#e8eaf0;--mut:#9aa3b5;--pri:#9d94ff;--pri2:#25254a;--ok:#5fd38d;--okbg:#14301f;--bad:#f28b82;--badbg:#3a1a1a;--line:#2e3340;--warn:#332b12}}
body{font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{background:none;color:var(--ink);display:block;padding:18px 16px 4px;max-width:1100px;margin:0 auto;border-bottom:1px solid var(--line)}
header .kick{font-size:12px;letter-spacing:.12em;color:var(--mut);font-weight:700}header .kick span{letter-spacing:0;font-weight:400;margin-left:12px}
header h1{font-size:24px;margin:14px 0 2px;color:var(--mut)}header p{margin:0 0 8px;color:var(--mut);font-size:13.5px}header .legend{font-size:13px;color:var(--ink);margin:6px 0 8px}header .legend b{color:var(--pri)}
nav{grid-template-columns:repeat(5,1fr);gap:8px;padding:14px 16px 6px}
nav button{border:1px solid var(--line);border-radius:8px;padding:9px 12px;box-shadow:0 1px 2px rgba(0,0,0,.06);font-size:12.5px}
nav button b{font-size:15px}nav button.on{background:var(--card);border:1.5px solid var(--pri)}nav button.on b,nav button.on span{color:var(--pri)}
.card{border-radius:10px;padding:14px 18px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
h2{font-size:19px}h3{font-size:15.5px}
.btn{background:var(--card);color:var(--ink);border:1px solid #9aa0ad;border-radius:7px;padding:7px 14px;font-size:14px;font-weight:600}
.btn:not(.alt):not(.bad){border-color:var(--pri);color:var(--pri)}.btn.alt{background:var(--card);color:var(--ink)}.btn.bad{background:var(--card);color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 10px;font-size:13px;border-radius:6px}.btn:hover{background:var(--pri2)}
input,select,textarea{border:1px solid var(--line);border-radius:7px;padding:8px 11px;font-size:14.5px}
label{font-size:13px;color:var(--ink);margin-top:10px}
.tag{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:7px;font-size:13px}
.pill{background:var(--pri2);color:var(--pri);font-weight:600}.pill.okp{background:var(--okbg);color:var(--ok)}
.bgl,.strip{background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:13px}.away{background:var(--card);border:1px solid var(--line)}
.fb.info{background:var(--warn)}.opt{border:1px solid var(--line);border-radius:8px;font-size:14.5px}
.lib{border:1px solid var(--line);border-radius:7px;font-size:13px}.lib.ready{border-color:var(--ok);background:var(--okbg)}
.fcard{border:1px solid var(--line);border-radius:8px}.fcard.s1{background:var(--card);border-color:#b9b2f5}
details{border-radius:8px}code{background:#f2f3f7;color:#273469}
@media (prefers-color-scheme:dark){code{background:#232838;color:#c9d2ff}}
.path{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 26px}.pcol{border:1px solid var(--line);border-radius:8px;padding:8px 10px;position:relative}
.pcol h4{margin:0 0 6px;font-size:13px;color:#2a3a9c}.pcol:not(:nth-child(4n))::after{content:"→";position:absolute;right:-19px;top:45%;color:var(--mut)}
.pt{display:flex;gap:5px;align-items:center;margin:5px 0}.pt button.t{flex:0 1 auto;text-align:left;border:1px solid #9aa0ad;border-radius:6px;background:var(--card);color:var(--ink);font-size:12.5px;padding:3px 8px;cursor:pointer}
.pt button.t.done{border-color:var(--ok)}.pt button.t.here{border:2px solid var(--pri);font-weight:700}.pt button.s{border:1px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer;font-size:12px;padding:2px 6px;color:var(--mut)}
@media (max-width:900px){.path{grid-template-columns:repeat(2,1fr)}nav{grid-template-columns:repeat(3,1fr)}}
@media (max-width:640px){.path{grid-template-columns:1fr}nav{grid-template-columns:repeat(2,1fr)}.pcol::after{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="bar"></div>
<div id="toast"></div>
<script>
'use strict';
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const dkey=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const arr=x=>Array.isArray(x)?x:(x==null||x===''?[]:[x]);
const str=x=>x==null?'':(typeof x==='object'?Object.values(x).map(v=>typeof v==='object'?JSON.stringify(v):v).join(' — '):String(x));
const norm=s=>str(s).toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');
const mem={};
const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return k in mem?JSON.parse(mem[k]):d}},
  set(k,v){const s=JSON.stringify(v);try{localStorage.setItem(k,s);return true}catch(e){mem[k]=s;return false}},
  raw(k){try{return localStorage.getItem(k)||''}catch(e){return mem['r'+k]||''}},
  setRaw(k,v){try{localStorage.setItem(k,v)}catch(e){mem['r'+k]=v}},
  del(k){try{localStorage.removeItem(k)}catch(e){delete mem['r'+k]}}
};
function toast(m,err){const t=$('#toast');t.textContent=m;t.className=err?'err':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',err?7000:2600)}
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)+s.length.toString(36)};
const scrub=t=>str(t).replace(/[\w.+-]+@[\w-]+\.[\w.-]+/g,'[email]').replace(/\+?\d[\d\s().-]{8,}\d/g,'[number]');
const clean=t=>scrub(t).trim();

/* ============ state ============ */
const DEF={model:'gemini-3.8-flash',fast:'gemini-3.5-flash-lite',limit:0,research:true,bg:true,bgMax:200,level:'scratch',role:'SAP Order-to-Cash (OTC) consultant',background:'',focus:'Order-to-Cash (SD) and its integrations',rate:1,voiceA:'',voiceB:'',stage:'prep'};
let S=normState(LS.get('sc_state',null));
function normState(s){s=s||{};s.set=Object.assign({},DEF,s.set||{});s.usage=s.usage||{day:'',calls:0,tokens:0,bg:0};s.cache=s.cache||{};if(s.set.role==='Executive / VP-level SAP leader'&&!s.set.level)s.set.role=DEF.role;if(!s.set.bgV){s.set.bgV=1;if(Number(s.set.bgMax)<=40)s.set.bgMax=200}s.prog=s.prog||{};s.queue=[];s.sopSkip=s.sopSkip||{};s.sopFail=s.sopFail||{};s.customFams=Array.isArray(s.customFams)?s.customFams:[];s.lib=(Array.isArray(s.lib)?s.lib:[]).filter(x=>x&&x.kind!=='sop');s.chat=Array.isArray(s.chat)?s.chat:[];return s}
function save(){if(!LS.set('sc_state',S)){S.cache={};if(!LS.set('sc_state',S))toast('Browser storage is full. Delete old items in Library.',true)}}
const hasKey=()=>!!LS.raw('sc_key');
let LASTSRC=[];

/* ============ Gemini ============ */
const LEVELS={scratch:'LEVEL: complete beginner. Teach from zero in very small steps, one idea at a time, always starting with the business story before any SAP screen or configuration, and check understanding often.',consultant:'LEVEL: junior to mid OTC consultant. Go to hands-on depth: configuration paths, tcodes, Fiori apps, tables, issue analysis, and consultant-style interview questions.',lead:'LEVEL: senior/lead consultant. Focus on solution design, integration trade-offs, global template decisions, risk, and lead/architect interview questions.',vp:'LEVEL: executive. Focus on business value, transformation, governance, KPIs, vendor management, and VP-level interview questions; keep technical detail brief but accurate.'};
const sysPrompt=()=>`${LEVELS[S.set.level||'scratch']} You are SAP Coach: a patient senior SAP mentor and executive interview coach. The learner knows NOTHING about SAP or configuration. Teach like they are five years old first: plain words, everyday analogies, define every term and acronym the first time. Then go deeper, down to real configuration detail. ${S.set.stage==='role'?`The learner NOW HOLDS the role of ${S.set.role}. Help them perform it: decisions to make, governance, steering committees, budgets, vendor and system-integrator management, risks, KPIs, and the questions to ask their teams and partners (with what a good answer sounds like). Where a format asks for interview questions, give the questions a leader in this role gets asked by the board, peers, auditors and teams, plus questions to ask their own team.`:`Prepare them for ${S.set.role} interviews: business outcomes, risk, controls, program delivery and stakeholder language, in addition to hands-on detail.`} Accuracy rules: use real transaction codes, Fiori app names/IDs, SPRO/IMG paths, tables and SAP Note numbers only when you are confident; otherwise say "verify on help.sap.com". Prefer SAP S/4HANA (latest releases; mention Cloud Public Edition vs Private Edition/on-premise differences) and say which release introduced a feature when known. Never invent facts about a company; say what is publicly known and mark guesses as assumptions. Plain text only, no markdown, no LaTeX. Learner profile: target role: ${S.set.role}; background: ${S.set.background||'not given'}; focus area: ${S.set.focus||'general SAP'}. Today is ${dkey()}.${S.client&&S.client.name?' CLIENT CONTEXT: the learner is preparing for work at '+S.client.name+'. '+(S.client.ctx||'')+' Where it fits, ground examples, scenarios and questions in this client\'s business.':''}${S.set.research?' '+ORDER:''}`;
const ORDER='When you search, check sources in this order and prefer the earlier ones when they disagree: (1) official SAP documentation on help.sap.com, including product documentation, What\'s New / release notes and the Feature Scope Description; (2) the official SAP website: sap.com, SAP Architecture Center (architecture.learning.sap.com, the official SAP reference architectures), SAP Learning, SAP Roadmap Explorer, SAP Best Practices / Signavio Process Navigator, SAP Fiori Apps Reference Library; (3) SAP Notes and Knowledge Base Articles (me.sap.com, support.sap.com, userapps.support.sap.com) for standard, SAP-recommended workarounds; (4) SAP Community (community.sap.com) blogs and question threads for real-world discussions and workarounds; (5) SAP Joule: what the Joule copilot can do for this topic and in which products/releases; (6) training videos and courses: YouTube (SAP official channels first, then reputable trainers) and the public pages of Udemy courses (use their titles, descriptions and curriculum outlines; you cannot watch paid content); (7) public GitHub repositories (SAP-samples, SAP-docs, SAP-archive, and community study repos; treat community repos as unverified, and mention their licence when you cite code); (8) any other publicly available documentation (partner blogs, analyst and consulting articles). Say which kind of source a key fact comes from when it matters.';
const RETRY_MS=()=>window.__fcFast?5:900;
function errMsg(e){
  const m=String(e&&e.message||e);
  if(m==='NOKEY')return '🔑 Paste your Gemini key in Settings first.';
  if(m==='LIMIT')return '⏸️ Daily AI limit reached (change it in Settings).';
  if(/^HTTP 400/.test(m)&&/key/i.test(m))return '🔑 Google says the key is not valid. Check Settings.';
  if(/^HTTP (401|403)/.test(m))return '🔑 Key rejected, or the Gemini API is not enabled for it.';
  if(/^HTTP 404/.test(m))return '🤖 Model name not found. Fix the model names in Settings (see ai.google.dev/gemini-api/docs/models).';
  if(/^HTTP 429/.test(m))return '🐢 Google rate limit hit. Wait a minute and try again.';
  if(/^HTTP 503/.test(m))return '🐢 Google says this model is busy right now. It retries by itself; or try again in a few minutes.';
  if(m==='BADJSON')return '😕 The AI answer was garbled. Please try again.';
  if(/Failed to fetch|NetworkError|TypeError/i.test(m))return '📡 Cannot reach Google. Check the internet connection.';
  return '⚠️ '+m.slice(0,200);
}
const searchOK=()=>S.noSearchDay!==dkey();
async function callGemini(body,model,fb){
  const key=LS.raw('sc_key');if(!key)throw new Error('NOKEY');
  const day=dkey();if(S.usage.day!==day)S.usage={day,calls:0,tokens:0,bg:0};
  if(Number(S.set.limit)>0&&S.usage.calls>=Number(S.set.limit))throw new Error('LIMIT');
  if(S.noMainDay===dkey()&&model===S.set.model&&S.set.fast)model=S.set.fast;
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
  let last;
  for(let i=0;i<3;i++){
    try{
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});
      if(r.ok){
        const j=await r.json();
        S.usage.calls++;S.usage.tokens+=j.usageMetadata?.totalTokenCount||0;S.usage.tin=(S.usage.tin||0)+(j.usageMetadata?.promptTokenCount||0);S.usage.tout=(S.usage.tout||0)+(j.usageMetadata?.candidatesTokenCount||0);if(body.tools)S.usage.srch=(S.usage.srch||0)+1;save();
        LASTSRC=(j.candidates?.[0]?.groundingMetadata?.groundingChunks||[]).map(c=>c.web).filter(Boolean).slice(0,6);
        const text=(j.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join('').trim();
        if(!text)throw new Error('The AI gave no answer ('+(j.promptFeedback?.blockReason||j.candidates?.[0]?.finishReason||'empty')+'). Try again.');
        return text;
      }
      let msg='';try{msg=(await r.json()).error?.message||''}catch(e){}
      last=new Error('HTTP '+r.status+' '+msg);
      if(r.status===429&&body.tools&&/quota/i.test(msg)){S.noSearchDay=dkey();save();delete body.tools;i=-1;continue}
      if(r.status===429&&/quota/i.test(msg)&&model!==S.set.fast&&S.set.fast){S.noMainDay=dkey();save();return callGemini(body,S.set.fast,true)}
      if(![429,500,502,503,504].includes(r.status))throw last;
    }catch(e){
      if(e===last&&!/^HTTP (429|5)/.test(e.message))throw e;
      if(/^The AI gave no/.test(e.message))throw e;
      last=e;
    }
    if(i<2)await new Promise(r=>setTimeout(r,RETRY_MS()*Math.pow(2,i)));
  }
  if(/^HTTP (429|503)/.test(String(last&&last.message))&&model!==S.set.fast&&!fb)return callGemini(body,S.set.fast,true);
  throw last;
}
function buildBody(prompt,o){
  const contents=o.contents?o.contents.map(c=>({role:c.role,parts:[{text:scrub(c.text)}]})):[{role:'user',parts:[{text:scrub(prompt)}]}];
  const body={systemInstruction:{parts:[{text:sysPrompt()+(o.sys?' '+o.sys:'')}]},contents,generationConfig:{temperature:o.temp??0.5}};
  if(o.search&&searchOK())body.tools=[{google_search:{}}];else if(o.json)body.generationConfig.responseMimeType='application/json';
  return body;
}
function parseJSON(t){

}

const enVoices=()=>{try{return speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}catch(e){return []}};
function pickVoice(role){const v=enVoices();if(!v.length)return null;const a=v.find(x=>x.name===S.set.voiceA)||v[0];const b=v.find(x=>x.name===S.set.voiceB)||v.find(x=>x!==a&&x.name.split(' ')[1]!==a.name.split(' ')[1])||v.find(x=>x!==a)||a;return role==='b'?b:a}
function chunks(t){const out=[];str(t).split(/(?<=[.!?;:])\s+/).forEach(s=>{while(s.length>220){let k=s.lastIndexOf(' ',220);if(k<80)k=220;out.push(s.slice(0,k));s=s.slice(k)}if(s.trim())out.push(s.trim())});return out}
function play(items,title){
  if(!window.speechSynthesis)return toast('Voice is not supported in this browser',true);
  speechSynthesis.cancel();PL.q=[];arr(items).forEach((it,n)=>chunks(it.text).forEach(c=>PL.q.push({t:c,r:it.role||'a',n})));
  if(!PL.q.length)return;PL.i=0;PL.on=true;PL.title=title||'Listening';

function speakNext(){
  if(!PL.on)return bar();
  if(PL.i>=PL.q.length){PL.on=false;PL.i=0;try{PL.lock&&PL.lock.release()}catch(e){}return bar()}
  const c=PL.q[PL.i],u=new SpeechSynthesisUtterance(c.t),v=pickVoice(c.r);

eady exists in your system and skip this step (a transaction and what to look for), actions: 4-10 click-by-click lines a first-timer follows blindly (exact buttons, e.g. 'Click New Entries', 'Click Copy As (F6)', 'Save (Ctrl+S) and assign a customizing transport request'), fields: EVERY field to fill, 3-12 {field: the label exactly as SAP shows it, value: the value to enter, note: what it means}, values: the key settings in one line, check: how to prove it worked, why: one plain sentence on why the scenario needs it, verify_note: '' or one line}}.", "errors": "You write the TROUBLESHOOTING section of an SAP Standard Operating Procedure for one scenario: the errors that appear when its configuration or master data is missing or wrong. WRITING STYLE (critical) -- two registers. (1) PLAIN fields (story, why_business_needs_it, why, if_missing, plain_meaning, symptom, impact, when_used): one everyday sentence a newcomer understands, then the precise detail. (2) TECHNICAL fields (everything else: step, where, values, fields, settings, fix steps, cause, table cells, verify, prevent): CONSULTANT-GRADE and POINTED -- no analogies, never start with 'You', no 'Technically,'; state object and value with exact codes, e.g. 'Doc type UB: control indicator T (Transport) -> no calculation schema, no Conditions tab'. Explain an acronym once in brackets. Only use transactions, IMG paths, Fiori apps, tables, fields, SAP Notes and message numbers that exist in current SAP S/4HANA (from a source or from standard SAP knowledge); never make up a code or a Note number -- if you don't know a code, describe the object and flag it in 'verify_note'. Use current SAP naming. Use Google Search to verify the exact SAP message texts and message class / number (e.g. 'V1 801', 'M7 021', 'VF 016') on SAP Help, SAP Community or SAP Notes summaries. If you cannot verify a number, set number to '' and keep only the text you are sure of -- never guess a number. Return ONLY a JSON object: {\"errors\": array of 6-10 objects, most common first: {title: short name of the problem, where_seen: the transaction / step where the user sees it (e.g. 'VL10B -- creating the delivery'), message_type: 'E' (error), 'W' (warning), 'I' (information) or 'A' (termination), message_class: e.g. 'V1' or '', message_number: e.g. '801' or '', message_text: the message as SAP shows it, display: 'status bar', 'popup' or 'log', plain_meaning: what it means, told so a five-year-old understands, cause: the precise root cause, config_step: which configuration or master-data step is missing or wrong (match the scenario's setup steps by name), fix_steps: array of 2-6 {step, where: T-code / SPRO path / app, values}, verify: how to confirm it is fixed (which transaction to re-run and what you should now see), prevent: one sentence on how to stop it happening again, ref_title: title of ONE real public page you found that discusses this exact message (SAP Help, SAP Community, an SAP Knowledge Base Article page), ideally showing a screenshot of it, ref_url: its URL -- both '' if you found none, never invent a URL}, \"sources\": array of {title, url, date} -- real URLs you found}.", "practice": "You write two sections of an SAP Standard Operating Procedure for a scenario family (all its variants are listed in the input), for a support and implementation team: the PRODUCTION issues that hit live systems (not setup mistakes -- those are covered elsewhere), and best practices. Cover the whole family: spread the issues across the variants, including the cross-company / billing ones where they exist. WRITING STYLE (critical) -- two registers. (1) PLAIN fields (story, why_business_needs_it, why, if_missing, plain_meaning, symptom, impact, when_used): one everyday sentence a newcomer understands, then the precise detail. (2) TECHNICAL fields (everything else: step, where, values, fields, settings, fix steps, cause, table cells, verify, prevent): CONSULTANT-GRADE and POINTED -- no analogies, never start with 'You', no 'Technically,'; state object and value with exact codes, e.g. 'Doc type UB: control indicator T (Transport) -> no calculation schema, no Conditions tab'. Explain an acronym once in brackets. Only use transactions, IMG paths, Fiori apps, tables, fields, SAP Notes and message numbers that exist in current SAP S/4HANA (from a source or from standard SAP knowledge); never make up a code or a Note number -- if you don't know a code, describe the object and flag it in 'verify_note'. Use current SAP naming. Use Google Search on SAP Help, SAP Community and SAP Knowledge Base Article summaries to ground the production issues in problems real teams report. Return ONLY a JSON object: {\"production_issues\": array of 6-10, most common first {title, applies_to: which variant(s) it hits, using the variant names given (or 'All variants'), symptom: what users report, impact: what it costs the business, how_to_find: the transactions or reports you use to diagnose it, root_cause, fix_steps: array of 2-6 {step, where, values}, verify, prevent, ref_title: ONE real public page about it (SAP KBA, SAP Help, SAP Community), ref_url: its URL -- '' if none, never invent}, \"best_practices\": array of 6-10 {practice: a concrete, SAP-specific rule for THIS scenario that starts with a verb and names the setting, document type, job or report it is about (e.g. 'Schedule VL10B as a background job per shipping point', 'Monitor stock in transit weekly with MB5T') -- never generic process advice and never about sources or research, why: one plain sentence},\"sources\": array of {title, url, date} -- real URLs you found}.", "panel": "You prepare an SAP OTC lead to discuss one scenario family (all its variants are listed in the input) with a senior panel (CIO, SME architect, CFO). WRITING STYLE (critical) -- two registers. (1) PLAIN fields (story, why_business_needs_it, why, if_missing, plain_meaning, symptom, impact, when_used): one everyday sentence a newcomer understands, then the precise detail. (2) TECHNICAL fields (everything else: step, where, values, fields, settings, fix steps, cause, table cells, verify, prevent): CONSULTANT-GRADE and POINTED -- no analogies, never start with 'You', no 'Technically,'; state object and value with exact codes, e.g. 'Doc type UB: control indicator T (Transport) -> no calculation schema, no Conditions tab'. Explain an acronym once in brackets. Only use transactions, IMG paths, Fiori apps, tables, fields, SAP Notes and message numbers that exist in current SAP S/4HANA (from a source or from standard SAP knowledge); never make up a code or a Note number -- if you don't know a code, describe the object and flag it in 'verify_note'. Use current SAP naming.  Return ONLY a JSON object: {\"otc_impact\": 2-3 sentences -- where this family sits in Order-to-Cash and what it changes for orders, deliveries, billing, cash and the customer (for a non-OTC area: how it integrates with OTC), \"panel_qa\": array of 6-8 {question: what a senior panel really asks about this family (design choices, variant trade-offs, integration with OTC, production issues and how you avoid them, controls, S/4HANA / cloud direction), who: exactly 'CIO', 'SME' or 'CFO', how_to_answer: the strong answer in 4-6 sentences in this order -- the business scenario, why SAP is configured this way, the key configuration (codes), the leadership value (money, risk, KPIs), what's next, trap: the weak answer to avoid (one sentence)}, \"avoid_issues\": array of 4-6 {issue: a day-to-day problem in this family, avoid: the control, setting, job or check that prevents it}}.", "variants": "You list the variants of an SAP business scenario, so a support team gets an SOP for EVERY way the process runs, not just the most common one. Be COMPLETE: include every standard SAP S/4HANA variant a team meets in practice (for example, a Stock Transport Order family includes intra-company without delivery, intra-company with delivery, inter-company with delivery and billing, one-step vs two-step goods movement, and Advanced Intercompany Stock Transfer -- that is only an example; work out the right list for the scenario you are given). SIBLING PATHS (critical): also include the variants a consultant compares side by side because the SAME business need is met by a different fulfilment, document or posting path -- e.g. when a sales order triggers external procurement, both 'the supplier ships straight to the customer' and 'the supplier ships to our plant and we deliver' (individual purchase order) belong in the family; likewise with vs without delivery, with vs without billing, classic vs advanced, manual vs automatic. These are only examples -- find the siblings that are real for the scenario given, and name each with its distinguishing code (item category, document type, movement). If the scenario truly has a single way of working, return one variant. Only use codes you are sure exist in standard SAP. THE TOPIC DECIDES THE COLUMNS (critical): choose the 4-6 characteristics that really tell THIS family's variants apart, in the vocabulary of that domain -- e.g. for an STO family: 'Documents', 'Delivery', 'Billing', 'Movements', 'Cross-company'; for EDI / IDoc: 'Direction', 'Message type', 'IDoc basic type (latest)', 'ANSI X12', 'EDIFACT', 'SAP document' (each identifier its own column, latest versions); for consignment: 'Order type', 'Item category', 'Schedule line', 'Movement', 'Billing'; for an API / integration family: 'Protocol', 'API / service', 'Middleware', 'Direction', 'Trigger'. Never force logistics columns onto a non-logistics topic. Whatever the topic, put EACH of the topic's identifiers in its OWN column (never merge two into one cell) and use the latest SAP S/4HANA versions of codes. Cover every variant a support team really meets in that family. Also choose 4-6 GROUPS for the detailed configuration comparison, again in that domain's vocabulary (e.g. EDI: 'Message & format', 'Partner profile & port', 'Inbound / outbound processing', 'Mapping & data', 'Monitoring & errors', 'Organisation & business'). Return ONLY a JSON object: {\"family_title\": the proper name of the scenario family, \"summary\": 2 plain sentences on what the family is and how the variants differ, \"attributes\": array of 4-6 short column names, \"variants\": array with AS MANY variants AS THE FAMILY REALLY HAS -- some families have 2, others 10; never pad the list to reach a number, never merge genuinely different variants, never split one variant into near-duplicates (at most 12), most common first {name: precise variant name (e.g. 'Inbound sales order (ORDERS / 850)'), short: tab label of at most 4 words, when_used: the business situation, in plain words, values: array with EXACTLY one entry per attribute, same order -- codes or at most 6 words (e.g. 'ORDERS', 'ORDERS05', '850', 'Inbound'), key_config: the configuration that makes this variant different}, \"compare_groups\": array of 4-6 {name, covers: what rows belong in it, with example objects}}. Keep every field short -- this is a comparison table, the detail comes in each variant's SOP.", "quickref": "You build a QUICK-REFERENCE table for a family of SAP process variants, in the style of the SAP Help Portal comparison tables (e.g. the 'Stock Transfer Using a Stock Transport Order' page): variants are the columns, the 8-14 MOST DECISIVE characteristics are the rows (for a stock transfer: order type, item category, movement types GI / GR, delivery type, schedule line category, billing type, invoice document type, price basis, stock after goods issue, cross-company clearing; for EDI / IDoc e.g.: 'Direction', 'Message type', 'IDoc basic type (latest in S/4HANA)', 'Earlier basic types still seen', 'ANSI X12 transaction set', 'EDIFACT message', process code or output type, partner profile / port, function module, SAP document, status codes). Whatever the topic: each of its identifiers gets its OWN row, the LATEST version first and earlier versions still met in live systems in a keep steps that only some variants need as their own rows. Keep the natural setup order. Settings are pointed and exact (e.g. 'BSART UB, control T', 'NB + M/06/M/08 schema + IV01', 'LOG_MM_SIT active'); a variant that needs a different setting for the same activity gets that setting -- never 'Not needed' when the variant still needs it in another form. Return ONLY a JSON object: {\"rows\": array of 8-24 {activity: a noun phrase naming the configuration object (e.g. 'Purchasing document type', 'Pricing / calculation schema') -- never a sentence starting with 'You', where: T-code or short IMG path, cells: array with EXACTLY one entry per variant in the SAME ORDER as given, each {step_no: that variant's step number for this activity, or null if the variant doesn't need it, setting: the key value for that variant in at most 10 words (e.g. 'UB', 'NB + supplier for plant 1010', 'Not needed')}}}. Every step of every variant must appear in exactly one row. Only use codes that appear in the input or that you are sure of.", "uat": "You write the USER ACCEPTANCE TEST (UAT) script and the DOCUMENT FLOW for ONE variant of an SAP process, for a support and implementation team. WRITING STYLE (critical) -- two registers. (1) PLAIN fields (story, why_business_needs_it, why, if_missing, plain_meaning, symptom, impact, when_used): one everyday sentence a newcomer understands, then the precise detail. (2) TECHNICAL fields (everything else: step, where, values, fields, settings, fix steps, cause, table cells, verify, prevent): CONSULTANT-GRADE and POINTED -- no analogies, never start with 'You', no 'Technically,'; state object and value with exact codes, e.g. 'Doc type UB: control indicator T (Transport) -> no calculation schema, no Conditions tab'. Explain an acronym once in brackets. Only use transactions, IMG paths, Fiori apps, tables, fields, SAP Notes and message numbers that exist in current SAP S/4HANA (from a source or from standard SAP knowledge); never make up a code or a Note number -- if you don't know a code, describe the object and flag it in 'verify_note'. Use current SAP naming. Return ONLY a JSON object: {\"doc_flow\": array of 4-9 objects in the order the documents are created {doc: the business document (e.g. 'Stock transport order', 'Outbound delivery', 'Goods issue (material document)', 'Intercompany billing document'), tcode: the transaction or Fiori app that creates it, tables: its main tables (e.g. 'EKKO / EKPO', 'LIKP / LIPS', 'MKPF / MSEG or MATDOC', 'VBRK / VBRP'), what: one plain sentence on what it does, module: e.g. 'MM', 'SD', 'LE', 'FI'}, \"test_cases\": array of 4-6 {id: 'TC01'..., title, type: 'Happy path', 'Negative' or 'Edge case' (at least one of each), preconditions: what must exist first, steps: array of 2-8 {step: what the tester does, tcode, data: realistic example test data (plants 1010/1020, material, quantity), expected: what the tester should see}, expected_result: the end state, documents_created: e.g. 'STO 45000012, delivery 80000034, material doc 4900000123'}}. Negative tests must name the exact message the tester should get when they exist.", "verify": "You FACT-CHECK the SAP codes used in a Standard Operating Procedure. From the SOP text given, pick the 15-30 codes that matter most: transaction codes, document / item / schedule line categories, delivery and billing types, movement types, condition types, tables, fields and message class + number. Use Google Search (help.sap.com, SAP Community, SAP Note and KBA summaries) to check EACH one is real and is used this way in SAP S/4HANA. Be strict: 'verified' only when a source confirms it for this use. Return ONLY a JSON object: {\"checks\": array of {code: exactly as written in the SOP, kind: 'T-code', 'Document type', 'Item category', 'Delivery type', 'Billing type', 'Movement type', 'Condition type', 'Table', 'Field', 'Message' or 'Other', status: 'verified' (a source confirms it), 'corrected' (it's wrong -- put the right code in correct) or 'unverified' (you couldn't confirm it), correct: the right code when corrected else '', note: at most 20 words, source_url: the page that confirms or corrects it, '' if none}, \"step_tcodes\": array of {step: the step number, tcode, source_url} -- ONLY for configuration steps whose 'where' is an IMG / SPRO path without a transaction: the DIRECT transaction code that opens that same IMG activity's screen (e.g. OVX5, VOV8, OVLK, 0VTC, OBYC; 'SM30 <view name>' only when a source shows the activity is that maintenance view). Only when a source confirms it; if the activity is reached only through SPRO, leave that step out}. Never invent a URL or a transaction code.", "compare_head": "You build a READY-REFERENCE configuration comparison matrix for a family of SAP process variants: the variants are the columns, configuration aspects are the rows. A consultant must be able to see at a glance exactly what is set differently in each variant -- field by field, including the item category and the exact fields that differ, in the vocabulary of the family's own domain (for EDI: message type, IDoc basic type / extension, X12 / EDIFACT number, partner profile WE20, port WE21, process code, function module, output type, status codes). Cover ONLY these groups, in order: ", "compare_tail": ". Write 8-13 rows. Use exact SAP codes (e.g. 'UB', 'NLCC', 'NLN', 'IV', '641', 'KBN', 'ORDERS05') and only codes you are sure exist in standard SAP S/4HANA; write 'Not used' where an aspect doesn't apply and 'Same' only when it truly doesn't differ. Be terse and exact -- this is a consultant's matrix (e.g. 'M/06 + M/08 schema; info record ME11; IV01 in billing'), never sentences starting with 'You'. GROUNDING (critical): use Google Search on help.sap.com, learning.sap.com, SAP Community and SAP Note / KBA summaries to confirm the IMG paths, transactions, settings and codes for THIS variant. Prefer what the sources say over memory; where sources disagree, follow help.sap.com. Where no source shows a detail (screen labels, example values, the exact click sequence), STILL write it from standard SAP S/4HANA configuration knowledge -- the way an experienced consultant would configure it in a sandbox -- and say what to double-check in that step's 'verify_note'. An empty or partial configuration is NEVER acceptable: the reader needs a complete, followable setup, with the doubts marked, not withheld. Return ONLY a JSON object: {\"rows\": array of {group: one of the groups above, aspect: the row name (e.g. 'Delivery item category'), values: array with EXACTLY one value per variant, in the SAME ORDER as the variants given (at most 10 words each), difference: one plain sentence (at most 20 words) on why it differs and what it means, source: the SAP Note number + title or SAP Help / SAP Learning page that confirms the row ('' if none), source_url: its URL ('' if none; never invent)}}.", "OTC_LENS": "OTC LENS (critical): this SOP is for an SAP Order-to-Cash (OTC) lead. Write every part from the OTC point of view. If the scenario belongs to ANY other area or system (any SAP module or product, an industry solution, or a non-SAP system that exchanges data with OTC -- e.g. warehouse, transport, procurement, finance, tax, CPQ, e-commerce, EDI / B2B, payments, CRM), make it about that area's INTEGRATION WITH OTC: the hand-offs both ways (e.g. sales order -> outbound delivery -> warehouse task -> goods issue -> billing), the OTC documents, settings and master data it depends on, what breaks in OTC when it fails (orders blocked, deliveries stuck, billing wrong) and the OTC KPIs it moves. Keep detail that never touches OTC to a minimum."};

function parse(t){
  t=String(t||'').replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'').trim();
  try{return JSON.parse(t)}catch(e){}
  const a=t.search(/[\[{]/);if(a<0)throw new Error('BADJSON');
  const b=t.lastIndexOf(t[a]==='{'?'}':']');
  try{return JSON.parse(t.slice(a,b+1))}catch(e){}
  try{return JSON.parse(t.slice(a,b+1).replace(/,\s*([}\]])/g,'$1'))}catch(e){throw new Error('BADJSON')}

  const vs=arr(f.variants).map(v=>v.name).filter(Boolean),out=[];
  const need=(part,v)=>{if(!get(key(part,fam,v)))out.push({part,variant:v||''})};

  vs.forEach(v=>{need('core',v);const c=get(key('core',fam,v));if(!c||c===true||!notStd(c))need('errors',v)});

function variantBody(fam,F,v,withFamily){
  const g=(p,n)=>{const x=DB.mem.get(SOPE.key(p,fam,n));return x&&x!==true?x:null};
  const c=g('core',v.name),e=g('errors',v.name),pq=g('prereq',v.name),u=g('uat',v.name),vf=g('verify',v.name),pr=g('practice'),n=[0],h=t=>`<h2>${++n[0]}. ${t}</h2>`;
  if(!c)return `<h1>${esc(v.name)}</h1><p>Not written yet.</p>`;
  let o=`<h1>${esc(c.title||v.name)}</h1><p class="sub">Standard Operating Procedure · ${esc(F.family_title||fam)} · SAP S/4HANA Order-to-Cash</p>
  <table class="ctl"><tr><td>Document ID</td><td>SOP-${esc(norm(fam).slice(0,10).toUpperCase())}-${esc(norm(v.short||v.name).slice(0,8).toUpperCase())}</td><td>Version</td><td>1.0 (draft)</td><td>Date</td><td>${esc(c.generated||dkey())}</td></tr><tr><td>Variant</td><td>${esc(v.name)}</td><td>Prepared by</td><td>SAP Coach (AI-assisted research)</td><td>Reviewed / approved</td><td>&nbsp;</td></tr></table>`;

  if(arr(c.modules).length)o+=h('Modules and hand-offs')+dtab(['Module','Role','Hands off to'],arr(c.modules).map(m=>[`<b>${esc(m.module)}</b>`,esc(m.role),esc(m.hands_off_to)]));
  if(arr(c.prerequisites).length||pq)o+=h('Set up first (must already exist)')+dul(c.prerequisites)+(pq&&arr(pq.prereq_steps).length?dtab(['#','Step / where','Click by click','Fields','Check','Skip if'],arr(pq.prereq_steps).map((s,i)=>{const r=dstep(s,i);r[5]=esc(s.skip_if||'');return r})):'');
  if(arr(c.config_steps).length)o+=h('Configuration guide')+dtab(['#','Step / where / settings','Click by click','Fields','Check','If missing'],arr(c.config_steps).map(dstep));
  if(arr(c.run_steps).length)o+=h('Day-to-day run')+dtab(['#','What the user does','Transaction / app','Result'],arr(c.run_steps).map((r,i)=>[i+1,esc(r.step),`<code>${esc(r.transaction)}</code>`,esc(r.result)]));
  if(arr(c.key_tables).length)o+=h('Key tables')+dul(c.key_tables);
  if(e&&arr(e.errors).length)o+=h('Setup errors')+dtab(['Problem','Message','What it means','Cause','Fix','Verify / prevent'],arr(e.errors).map(x=>[`<b>${esc(x.title)}</b><br>${esc(x.where_seen)}`,`<code>${esc([x.message_type,x.message_class,x.message_number].filter(Boolean).join(' '))}</code><br><span class="err">${esc(x.message_text)}</span>`,esc(x.plain_meaning),esc(x.cause),`<span class="fix">${dfix(x.fix_steps)}</span>`,esc(x.verify)+(x.prevent?'<br><i>'+esc(x.prevent)+'</i>':'')]));
  if(withFamily&&pr){
    if(arr(pr.production_issues).length)o+=h('Production issues')+dtab(['Issue','Symptom / impact','How to find it','Root cause','Fix','Prevent'],arr(pr.production_issues).map(x=>[`<b>${esc(x.title)}</b><br>${esc(x.applies_to)}`,esc(x.symptom)+'<br><i>'+esc(x.impact)+'</i>',esc(x.how_to_find),esc(x.root_cause),`<span class="fix">${dfix(x.fix_steps)}</span>`,esc(x.prevent)]));
    if(arr(pr.best_practices).length)o+=h('Best practices')+dtab(['Practice','Why'],arr(pr.best_practices).map(b=>[`<b>${esc(b.practice)}</b>`,esc(b.why)]));
  }
  if(u&&arr(u.test_cases).length){o+=h('Test script (UAT)')+dtab(['Document','Created with','Tables','What it does','Module'],arr(u.doc_flow).map(d=>[`<b>${esc(d.doc)}</b>`,`<code>${esc(d.tcode)}</code>`,`<code>${esc(d.tables)}</code>`,esc(d.what),esc(d.module)]));
    arr(u.test_cases).forEach(t=>{o+=`<h3>${esc(t.id)} ${esc(t.title)} (${esc(t.type)})</h3><p>Preconditions: ${esc(t.preconditions)}</p>`+dtab(['Step','T-code','Test data','Expected','Pass / fail'],arr(t.steps).map(s=>[esc(s.step),`<code>${esc(s.tcode)}</code>`,esc(s.data),esc(s.expected),'&nbsp;']))+`<p><b>Expected result:</b> ${esc(t.expected_result)}</p>`})}

  const src=arr(c.src).concat(arr(e&&e.src));if(src.length)o+=h('Sources consulted')+`<ul>${src.map(x=>`<li>${esc(str(x.title||x.uri))}</li>`).join('')}</ul>`;
  return o+`<p class="note">Generated with AI assistance from public sources. Transaction codes, configuration paths, message numbers and SAP Notes must be verified on help.sap.com and in your own system before this procedure is used operationally.</p>`;
}
function familyDoc(fam){
  const g=p=>{const x=DB.mem.get(SOPE.key(p,fam));return x&&x!==true?x:null},F=g('variants');if(!F)return '';
  const vs=arr(F.variants),names=vs.map(x=>x.short||x.name),qr=g('quickref'),cp=g('compare'),sm=g('stepmap'),pn=g('panel');
  let o=`<div class="cover"><h1>${esc(F.family_title||fam)}</h1><p class="sub">SOP family · ${vs.length} variant${vs.length>1?'s':''} · SAP S/4HANA Order-to-Cash · ${dkey()}</p><p>${esc(F.summary)}</p></div><div class="pb"><h2>Variants</h2>`+dtab(['Variant','When it is used'].concat(arr(F.attributes)).concat(['Key configuration']),vs.map(x=>[`<b>${esc(x.name)}</b>`,esc(x.when_used)].concat(arr(F.attributes).map((_,i)=>`<code>${esc(arr(x.values)[i]||'-')}</code>`)).concat([esc(x.key_config)])));
  if(qr&&arr(qr.qr_rows).length)o+=`<h2>Quick reference</h2>`+dtab(['Characteristic'].concat(names),arr(qr.qr_rows).map(r=>[`<b>${esc(r.label)}</b>`].concat(arr(r.values).map(x=>`<code>${esc(x)}</code>`))))+dul(qr.key_rules);
  if(cp&&arr(cp.compare_rows).length)o+=`<h2>Side-by-side configuration comparison</h2>`+arr(cp.groups).map(gn=>{const rows=arr(cp.compare_rows).filter(r=>r.group===gn);return rows.length?`<h3>${esc(gn)}</h3>`+dtab(['Aspect'].concat(names).concat(['Why it differs']),rows.map(r=>[`<b>${esc(r.aspect)}</b>`].concat(arr(r.values).map(x=>`<code>${esc(x)}</code>`)).concat([esc(r.difference)]))):''}).join('');
  if(sm&&arr(sm.step_rows).length)o+=`<h2>Step-by-step map</h2>`+dtab(['Configuration object','Where'].concat(names),arr(sm.step_rows).map(r=>[`<b>${esc(r.activity)}</b>`,`<code>${esc(r.where)}</code>`].concat(arr(r.cells).map(c=>(c.step_no?'['+c.step_no+'] ':'')+esc(c.setting)))));
  if(pn&&arr(pn.panel_qa).length)o+=`<h2>Panel Q&amp;A</h2><p>${esc(pn.otc_impact)}</p>`+dtab(['Who','Question','Strong answer','Weak answer to avoid'],arr(pn.panel_qa).map(q=>[esc(q.who),`<b>${esc(q.question)}</b>`,esc(q.how_to_answer),esc(q.trap)]));
  o+='</div>'+vs.map((v,i)=>`<div class="pb">${variantBody(fam,F,v,i===0)}</div>`).join('');
  return wrapDoc((F.family_title||fam)+' - SOP family',o);
}
function sopDocFor(kind){
  const fam=U.sop.fam,F=sg('variants');if(!F)return null;
  if(kind==='family')return {html:familyDoc(fam),name:'SOP family - '+(F.family_title||fam)};
  const v=arr(F.variants)[U.sop.vi||0];return {html:wrapDoc(v.name+' - SOP',variantBody(fam,F,v,true)),name:'SOP - '+v.name};
}
function printHtml(html,title){
  if(window.__printHook)return window.__printHook(html,title);
  const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);
  const d=f.contentWindow.document;d.open();d.write(html);d.close();
  setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){toast('Printing is blocked here. Use the Word download instead.',true)}setTimeout(()=>f.remove(),90000)},400);
  toast('In the print window, choose "Save as PDF" as the destination');
}

const QBASE=[{"id": 1, "cat": "VER", "diff": "H", "q": "Walk me through the Universal Journal in S/4HANA. Why does it eliminate the FI-CO reconciliation that ECC teams ran every period-end?", "kp": ["ACDOCA is a single table storing all FI, CO, Asset Accounting, and Material Ledger line items together", "In ECC, FI posted to BSEG and CO posted to COEP — separate ledgers requiring monthly reconciliation (2-3 FTE days)", "In S/4HANA every CO posting writes directly into ACDOCA alongside FI — they are the same document entry", "ACDOCA line contains: Company Code, GL Account, Cost Centre, Profit Centre, WBS, Material, Plant — all in one row", "Clients typically see 2-3 day reduction in monthly financial close cycle as a direct result"], "answer_summary": "ACDOCA = single source of truth. FI and CO are the same journal entry in S/4HANA. No reconciliation needed because they were never separate. Typical client benefit: 2-3 day reduction in monthly close cycle."}, {"id": 2, "cat": "VER", "diff": "E", "q": "What is the Clean Core principle SAP enforced from 2022 and how does it fundamentally change the way you architect extensions?", "kp": ["Clean Core means the S/4HANA system core is unmodified — enabling seamless upgrades without breaking custom code", "Forbidden: direct table modifications, non-released function modules, implicit enhancements inside standard programs", "Three extension tiers: Tier 1 Key User in-app, Tier 2 Developer in-app (BAdI with released interfaces only), Tier 3 Side-by-side on SAP BTP", "Any requirement not met by a released BAdI defaults to a BTP side-by-side extension — NOT custom ABAP inside S/4HANA", "SAP enforces compliance using ABAP Test Cockpit and SAP Cloud ALM from 2022 onwards"], "answer_summary": "Core stays unmodified. Three extension tiers: Key User tools, released BAdI, BTP side-by-side. Anything that cannot be done with released APIs goes to BTP — never custom ABAP inside S/4HANA core."}, {"id": 3, "cat": "VER", "diff": "M", "q": "A client on ECC EHP8 asks you which migration path to S/4HANA they should take. Walk me through how you would decide.", "kp": ["Three paths: Greenfield (fresh build 18-30 months), Brownfield (in-place conversion 9-15 months using SUM/DMO), Bluefield (selective data transition)", "Never recommend a path without first running SAP Readiness Check", "Brownfield is fast but carries all legacy technical debt", "Greenfield allows process redesign but requires full data migration and maximum change management effort", "Bluefield is for large groups migrating specific company codes selectively"], "answer_summary": "Run SAP Readiness Check first — always. Greenfield = clean slate, max effort. Brownfield = fast, carries legacy debt. Bluefield = selective entity migration for large groups."}, {"id": 4, "cat": "TM", "diff": "E", "q": "Design me a complete carrier selection and tendering process for a 3PL scenario — five preferred carriers and a spot market fallback. Tell me every configuration object involved.", "kp": ["Use zone-based transportation lanes, not point-to-point — 750 lanes vs 150,000 lanes at scale", "Carrier Selection Profile priority: lane assignment, rate comparison, capacity check, spot market", "Tendering profile: simultaneous EDI 204 to all preferred carriers, offer duration 4 hours planned vs 30 min same-day", "Carriers accept via EDI 990 within the offer window — rejection also via 990 with reason code", "Spot market trigger: all preferred carriers reject, CPI iFlow publishes load to spot platform via API", "Carrier performance BAdI: monitor rejection rate monthly — above threshold triggers contractual penalty clause"], "answer_summary": "Zone lanes + Carrier Selection Profile + Tendering Profile + EDI 204/990 + CPI spot market fallback. Each layer has a specific configuration object — never design point-to-point at scale."}, {"id": 5, "cat": "TM", "diff": "H", "q": "A Freight Order charge calculation is returning zero despite a valid carrier agreement. Walk me through your complete diagnosis.", "kp": ["/SCMTMS/MON_FO — check Charges tab, is a calculation sheet assigned?", "Check carrier agreement validity dates and company code match", "Transportation lane lookup chain: FO > Lane > Carrier Agreement > Calculation Sheet", "Check rate table /SCMTMS/TCM_RATE for carrier + route + weight break", "Check SLG1 for /SCMTMS/ errors — look for rate not found or calculation basis equals zero", "Most common root cause: carrier agreement validity expired"], "answer_summary": "Systematic 5-step diagnosis: (1) Charges tab, (2) agreement validity, (3) lane-carrier link, (4) rate table records, (5) SLG1 errors. Most common cause: expired agreement."}, {"id": 6, "cat": "TM", "diff": "H", "q": "Tell me about FU Building Rules in SAP TM. What happens when multiple criteria conflict and how does the system resolve it? Give me a real DSD example.", "kp": ["FU Building Rules consolidate Transportation Requirements into Freight Units using grouping fields, capacity limits, and incompatibility groups", "Grouping fields are AND conditions — all must match for consolidation", "Incompatibility groups always win — incompatible products get separate FUs regardless", "Capacity limit exceeded mid-consolidation causes automatic split", "PBNA example: group by Depot + Route + Delivery Date, max weight 44000 lbs, carbonated beverages and chemical cleaning are incompatible"], "answer_summary": "Incompatibility > Capacity > Grouping fields in conflict resolution. Real example: PBNA — depot+route+date grouping, 44k lb limit, chemical separation rule."}, {"id": 7, "cat": "EWM", "diff": "H", "q": "Explain Wave Management in SAP EWM. Walk me through the configuration, the release process, and what you do when a wave partially fails.", "kp": ["Wave template determines which ODOs join which wave based on shipping point, delivery type, and planned GI time", "Release process: stock availability check, WT creation, WO grouping by storage type, release to pickers atic issue — involve pricing master data team", "Prevention: pre-settlement pricing validation job should alert before settlement batch runs"], "answer_summary": "SLG1 exact error > VF01 manual test > check price list change date > VK11 fix > systematic escalation. 50 simultaneous failures = master data problem, not system error."}, {"id": 12, "cat": "INT", "diff": "E", "q": "Design a resilient CPI integration for a three-system order flow — OMS, S/4HANA, EWM. Tell me the error handling at every hop.", "kp": ["Hop 1 OMS to CPI: idempotency using order ID in CPI data store to prevent duplicate creation on retry", "Hop 1: immediate schema validation — return 400 with detail on failure so OMS can retry", "Hop 2 CPI to S/4HANA: use published REST API from SAP API Business Hub (Clean Core compliant)", "Hop 2: 3 retries with exponential backoff, S/4HANA business errors sent to OMS callback URL plus CPI alert", "Hop 3 S/4HANA to EWM: ALE/IDoc DELIVRY with ALEAUD monitoring — status 51 auto-creates ITSM incident", "Every hop: idempotency + dead-letter queue + alerting before humans notice"], "answer_summary": "Three hops, each with idempotency + retry + dead-letter + alert. CPI Data Store for dedup. BTP REST API for Clean Core. IDoc ALEAUD monitoring for EWM. Never skip a hop in the error model."}, {"id": 13, "cat": "INT", "diff": "H", "q": "Compare IDoc, RFC, OData, and REST API for S/4HANA integration. When do you use each one and what is the Clean Core position on RFC?", "kp": ["IDoc: asynchronous, file-based — best for EDI (204/990/856), legacy systems, guaranteed delivery", "RFC: synchronous direct call — SAP says do NOT use RFC for new integrations from 2022 (tight coupling, upgrade risk)", "OData: REST-based via SAP Gateway — used for Fiori apps, LMD driver app, external portals", "REST API via SAP API Business Hub: Clean Core compliant, versioned — default for all new S/4HANA integrations", "New integration default: REST API via CPI — IDoc only for EDI, RFC only in legacy landscapes"], "answer_summary": "IDoc=EDI/legacy. RFC=legacy only, not for new. OData=UI/mobile. REST API (published)=all new integrations. Clean Core says RFC is legacy coupling — retire it on new projects."}, {"id": 14, "cat": "RETAIL", "diff": "H", "q": "A fashion retailer wants IS-Retail with season management, generic articles, and assortment management. What are the design decisions that will make or break this implementation?", "kp": ["Generic article: one KMAT per style, variants = Size x Colour — 5x8x5000 styles = 200000 variants, plan data volume from day one", "Critical mistake: never create one assortment per store — cluster by format (A flagship, B standard, C small) = 3-5 assortments total", "Season = validity-based article listing — articles auto-delist at season end preventing reordering", "Open-to-buy planning: season budget allocated before article creation so buyers cannot exceed OTB commitment", "EAN/GTIN management: multiple barcodes per article (inner pack, outer pack, pallet) must all be maintained"], "answer_summary": "Key design decisions: volume-aware generic article structure, format-based assortments (NEVER store-level), season validity control, OTB enforcement. Each wrong = project failure."}, {"id": 15, "cat": "MFG", "diff": "H", "q": "What is PP/DS in S/4HANA and how does it differ from MRP? When would you recommend it and what did clients need before 1709?", "kp": ["MRP is infinite capacity planning in time buckets — plans without real capacity constraints", "PP/DS is finite capacity planning with detailed scheduling — optimises sequence within real constraints", "PP/DS embedded natively in S/4HANA from release 1709 — before that required separate SAP APO via CIF", "APO on ECC: two separate systems, CIF synchronisation failures, separate licensing and Basis team", "Choose PP/DS when: tight machine capacity constraints, sequence-dependent setup times, bottleneck resources", "Planning horizon: PP/DS for near-term detailed schedule, MRP for medium and long-term"], "answer_summary": "MRP = infinite, time-bucket. PP/DS = finite, sequence-optimised. Available natively since 1709, removing the need for standalone APO. Use PP/DS when capacity is the constraint."}, {"id": 16, "cat": "LEAD", "diff": "H", "q": "You are in a Fit-to-Standard workshop and the process owners keep insisting on customisations for everything. How do you handle this?", "kp": ["First categorise each request: legal/regulatory, legacy process never questioned, individual preference", "Quantify customisation cost: development + testing + documentation + maintenance over 7 years — put a number in front of the business", "Reframing: our competitors use the SAP standard process, customising means we own maintenance through every future upgrade", "Escalate to steering committee — process owners should not make custom development decisions unilaterally", "80% of customisation requests dissolve when the business sees the true 7-year cost"], "answer_summary": "Categorise > quantify 7-year cost > reframe as competitive liability > escalate to steering. 80% dissolve on cost exposure. 20% are genuine requirements worth solving."}, {"id": 17, "cat": "LEAD", "diff": "H", "q": "You have just been brought in as Solution Architect on a failing 12-month implementation in month 8. What do you do in your first 10 days?", "kp": ["Days 1-2: Listen only, one-on-one with every stream lead — read project plan, risk log, issue log — make zero changes", "Days 3-4: Technical deep dive — assess configuration quality, integration design, test strategy feasibility", "Days 5-6: Stakeholder reality check — meet business sponsor, is go-live date hard or soft?", "Days 7-8: Draft recovery plan — prioritise scope into critical vs deferrable to Phase 2, identify resource gaps", "Days 9-10: Present to steering committee — be completely honest about what you found", "Never over-promise in week one — the project failed because someone over-promised before you arrived"], "answer_summary": "Listen first (2 days). Assess technically (2 days). Test stakeholder reality (2 days). Draft honest recovery plan (2 days). Present to steering (2 days). Do NOT repeat the over-promising pattern."}, {"id": 18, "cat": "AMS", "diff": "E", "q": "Design the morning monitoring checklist for a DSD SAP landscape — 800 drivers, 15 depots. What do you automate and what do you review manually?", "kp": ["03:00 automated: all FOs for today in Released status — alert if any depot has more than 5% not released", "03:30 automated: route preparation complete with zero SLG1 pricing errors — immediate alert on any error", "03:30 automated: SAP Gateway OData service responding under 2 seconds", "04:00 manual: team reviews all overnight alerts, triages and assigns before drivers arrive at 05:30", "05:45 critical: every driver must have their route downloaded before departure", "The most important AMS metric in DSD is not incident response time — it is whether 100% of drivers have routes by 05:45 AM"], "answer_summary": "Automated alerts at 03:00-03:30 before team arrives. Manual review at 04:00. Critical checkpoint at 05:45. The business outcome is 100% drivers with routes — design everything around that."}, {"id": 19, "cat": "AMS", "diff": "H", "q": "A P1 is raised at 3 AM — SAP is showing 30-second response times on everything, started 20 minutes ago. Walk me through your exact response.", "kp": ["Minute 0-5: declare P1, open war room with Basis, database admin, network, functional lead", "Minute 5-10: SM50 work process utilisation, SM66 across all app servers, AL11 disk space, ST22 ABAP dumps", "Minute 10-15: HANA Studio/Cockpit — CPU, memory, long-running queries, lock wait chains", "Minute 15-20: identify the layer — DB bottleneck vs work process saturation vs network latency", "Minute 20+: status update to stakeholders every 15 minutes regardless of progress"], "answer_summary": "War room in 5 minutes. DB first (HANA Cockpit), then App (SM50/SM66), then Network. Status every 15 min — silence causes panic escalation. Identify the layer before going deep."}, {"id": 20, "cat": "IMPL", "diff": "H", "q": "Walk me through a robust data migration approach for a greenfield S/4HANA project using LTMC. What does a three-mock migration strategy look like?", "kp": ["LTMC uses predefined migration objects — no ABAP required for standard objects", "Key objects: Business Partner, Material Master, Condition Records, Open Sales Orders, AR balances, TM Locations/Lanes/Carrier Agreements", "Mock 1 (month 9): validate extraction and transformation logic, expect 30-40% error rate", "Mock 2 (month 14): full volume with cleansed data, target less than 5% error rate, measure duration for cutover planning", "Mock 3 Dress Rehearsal (month 16): full cutover simulation, target less than 1% error rate", "Data quality is always worse than the client believes — dedicate a Data Quality workstream from Day 1"], "answer_summary": "LTMC predefined objects. Three mocks: validation (30-40% error ok), full volume (<5%), dress rehearsal (<1%). Data quality is always the surprise — start the DQ workstream on Day 1."}, {"id": 21, "cat": "IMPL", "diff": "H", "q": "Design a complete cutover plan for S/4HANA go-live — five integrations, three company codes, and a maximum eight-hour downtime window.", "kp": ["T-5 days: freeze source system changes, begin data extracts", "T-2 days: pre-load master data in production to validate before downtime", "Hour 0-1: close legacy system, final snapshots, communicate blackout", "Hour 1-3: load transactional data in parallel by module — not sequentially", "Hour 3-5: integration smoke tests for all five integrations in parallel", "Hour 5-7: business validation by key users per company code, then Go/No-Go by business sponsor"], "answer_summary": "Pre-load master data before window. Load transactional in parallel (not sequential). Integration smoke tests all five simultaneously. Business validates, sponsor decides Go/No-Go with evidence."}, {"id": 22, "cat": "VER", "diff": "H", "q": "What is SAP BTP and how does it fit into the S/4HANA architecture? Name the five BTP services an architect uses most often.", "kp": ["SAP BTP is the cloud platform for building, integrating, and extending SAP enterprise applications", "In Clean Core: any requirement not met by a released BAdI goes to BTP side-by-side extension", "Integration Suite (CPI): central integration hub for all integration flows", "Event Mesh: asynchronous event-driven integration — publish/subscribe, decoupled, buffers peak load", "SAP Analytics Cloud: BI, planning, predictive analytics connected live to S/4HANA ACDOCA", "SAP AI Core: deploy ML models for demand forecasting, anomaly detection"], "answer_summary": "BTP = cloud platform for extensions and integrations. Five key services: Integration Suite, Event Mesh, SAC, AI Core, Work Zone. All requirements blocked by Clean Core go to BTP."}, {"id": 23, "cat": "AMS", "diff": "H", "q": "How do you build a knowledge management system for an SAP AMS team so that quality does not drop every time a consultant leaves?", "kp": ["Runbook library: every incident type occurring more than twice has a documented runbook — no ticket closed without runbook reference", "Configuration decision log: what was configured, the business requirement, and what alternatives were considered", "Shadow programme: 4 weeks minimum before any consultant rolls off", "Monthly knowledge checks: 5 system-specific questions to identify gaps before they become production incidents", "KPI target: 80% or more of incidents resolved using existing runbooks", "New joiners pass a knowledge test before joining the P1 on-call rotation"], "answer_summary": "Four components: runbook library (mandatory), config decision log (with reasoning), 4-week shadow minimum, monthly knowledge checks. KPI: 80%+ resolved by existing runbook."}, {"id": 24, "cat": "OIL", "diff": "E", "q": "Explain SAP IS-Oil TD. When does a client need it and how does it co-exist with SAP TM?", "kp": ["IS-Oil TD is for downstream oil and gas fuel distribution — bulk liquid in litres/gallons/barrels", "Core components: nomination processing, multi-compartment vehicle tracking, ASTM temperature/density correction, terminal integration, excise duty", "Temperature correction: ASTM D1250 applied automatically — measured volume to standard reference", "Terminal integration: direct connection to Toptech or Scully loading systems", "Co-existence: TD handles terminal-to-truck loading, TM handles secondary distribution route planning"], "answer_summary": "IS-Oil TD for bulk fuel distribution. Nominations (not SD orders), compartment tracking, ASTM correction, terminal integration, excise duty. TM for route planning, TD for loading/compliance."}, {"id": 25, "cat": "MFG", "diff": "H", "q": "A food manufacturer wants FEFO picking in SAP EWM with full shelf life management. Design it end to end from goods receipt to delivery.", "kp": ["Material master: activate shelf life management with total shelf life, minimum shelf life for GR, and customer MRSL", "Batch classification: SLED as a characteristic — assigned by operator at goods receipt", "GR block: if calculated SLED is less than minimum remaining shelf life, receipt is blocked and QI is triggered", "EWM FEFO: configure batch search strategy = FEFO in SPRO — earliest expiry proposed first", "Operators must confirm the exact batch proposed — cannot substitute a later expiry", "Customer MRSL in SD ATP: only batches with SLED > today + MRSL days are proposed"], "answer_summary": "Material master shelf life + SLED batch characteristic + GR validation block + EWM FEFO batch search strategy + customer MRSL check in ATP. All five layers must work together."}];
const QGP="You are a Senior SAP Architect with 20+ years of experience conducting Principal Architect and Solution Architect interviews at top consulting firms.\n\nGenerate {count} fresh, unique, architect-level SAP interview questions for the following area:\nCATEGORY: {category_label}\n\nRequirements:\n- Difficulty level: {diff_label} (M=Medium: concept+config knowledge, H=Hard: diagnosis+design under pressure, E=Expert: multi-system design+leadership)\n- Questions must be at Principal Architect level — not basic config questions, not Googling answers\n- Write each question exactly as a realistic hiring-manager prompt: include a client situation,\n  a business consequence, and a direct spoken ask such as \"How would you approach this?\",\n  \"What would you do first?\", or \"Talk me through your decision.\" Do not write topic statements,\n  study-note headings, or commands such as \"Design...\" without conversational context.\n- OTC is the primary cross-functional focus. Cover the complete OTC ecosystem where relevant:\n  customer/BP and product master, sales orders, pricing and condition technique, credit/FSCM,\n  AATP/product allocation/BOP, tax and eDocument, output, delivery/EWM/TM, billing,\n  FI-AR/CO/treasury, RAR, returns/repairs, intercompany/third-party, rebates,\n  e-commerce/CRM, IDoc/API/event/CPI/BTP integration, analytics, security, and compliance.\n- Each question must include: scenario context, specific technical depth, and a real business consequence\n- Key points must be specific configuration objects, transaction codes, or architectural decisions (not vague principles)\n- The model answer must be written as natural spoken interview dialogue, not notebook bullets.\n  Use first person, contractions, transitions such as \"I would start by...\", \"The reason is...\",\n  \"In a real implementation...\", and \"If that failed in production...\". It should sound like a\n  senior architect speaking for 45-90 seconds, not like an answer key. The response function qbValid(q){

  if(!Number.isInteger(q.correct_index)||q.correct_index<0||q.correct_index>3)return 'correct_index must be 0-3';
  if(!q.explanation||typeof q.explanation!=='object')return 'no explanation';

  return '';
}
